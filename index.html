// ── ORDENAÇÃO CENTRAL DE TAREFAS PENDENTES ──
// Usada no carrossel (renderPages), na tela cheia da categoria (renderCatFs)
// e na visão em grade/kanban (renderGrid), para garantir que a ordem seja
// sempre a mesma — inclusive ao adicionar tarefa nova e ao importar backup JSON.
//
// Prioridade:
// 1) Data marcada para hoje, amanhã, depois de amanhã (ou atrasada) → topo máximo
// 2) Tarefas com emoji 📅 no início do texto (fixadas manualmente)
// 3) Data marcada a partir de depois de amanhã (futuro distante)
// 4) Sem data e sem emoji especial
// 5) Sem data, com emoji especial (🌍📱🏠🎒)
const SPECIAL_EMOJIS = ['🌍','📱','🏠','🎒'];
function isPinnedEmoji(t) { return t.text.replace(/^\s+/, '').startsWith('📅'); }
function hasSpecialEmoji(t) { return SPECIAL_EMOJIS.some(e => t.text.includes(e)); }
function sortPendingTasks(tasksArr, cat) {
  const justAdded = tasksArr.filter(t => t.justAdded)
                            .sort((a, b) => (b.order || 0) - (a.order || 0));
  const rest = tasksArr.filter(t => !t.justAdded);

  // Tarefas com data SEMPRE mantêm a posição por data, não importa o que o 🌍 fizer.
  // "Perto": hoje até 4 dias a partir de hoje (inclui atrasadas) → fica no topo
  // "Longe": mais de 4 dias a partir de hoje → vai para o final da categoria
  const dateNear = rest.filter(t => t.dueDate && daysDiffFromToday(t.dueDate) <= 4)
                            .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const pinned   = rest.filter(t => isPinnedEmoji(t) && !t.dueDate)
                            .sort((a, b) => (b.order || 0) - (a.order || 0));
  const dateFar  = rest.filter(t => t.dueDate && daysDiffFromToday(t.dueDate) > 4)
                            .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const noDate   = rest.filter(t => !t.dueDate && !isPinnedEmoji(t));

  // Só a parte SEM data é reorganizável pelos comandos do 🌍 (ordem manual, array de data.tasks).
  // Categorias ainda não organizadas manualmente usam a separação padrão sem-emoji / com-emoji.
  let noDateOrdered;
  if (cat && data.manualOrderCats && data.manualOrderCats.includes(cat)) {
    noDateOrdered = noDate;
  } else {
    const noDateNoEmoji  = noDate.filter(t => !hasSpecialEmoji(t));
    const noDateWithEmoji = noDate.filter(t => hasSpecialEmoji(t));
    noDateOrdered = [...noDateNoEmoji, ...noDateWithEmoji];
  }

  return [...justAdded, ...dateNear, ...pinned, ...noDateOrdered, ...dateFar];
}

// Categorias organizadas manualmente (via botão 🌍) só reordenam a parte
// sem data — as tarefas com data marcada sempre mantêm a posição por data.
function orderedPending(cat, tasksArr) {
  return sortPendingTasks(tasksArr, cat);
}

function renderPages() {
  trackEl.innerHTML = '';

  allCats().forEach(cat => {
    const page = document.createElement('div');
    page.className = 'page' + (gradeMode ? ' fat' : '');
    const catTasks = data.tasks.filter(t => t.cat === cat);

    if (!catTasks.length) {
      page.innerHTML = `<div class="empty"><span class="empty-icon">○</span>Nenhuma tarefa em<br><b>${esc(cat)}</b></div>`;
    } else {
      const allPending = catTasks.filter(t => !t.done);
      const done       = catTasks.filter(t => t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));

      orderedPending(cat, allPending).forEach(t => page.appendChild(makeTaskEl(t)));

      if (done.length) {
        const div = document.createElement('div');
        div.className = 'done-divider';
        div.id = 'done-divider';
        div.textContent = 'Concluídas';
        page.appendChild(div);
        done.forEach(t => page.appendChild(makeTaskEl(t)));
      }
    }
    trackEl.appendChild(page);
  });
}

function openTaskLink(url) {
  // Tenta abrir em nova aba/janela (funciona na maioria dos navegadores reais)
  let win = null;
  try { win = window.open(url, '_blank', 'noopener,noreferrer'); } catch (e) {}
  if (win) { try { win.opener = null; } catch(e) {} return; }
  // Se o navegador/visualizador bloquear popups (comum em WebViews e visualizadores
  // de arquivo local), tenta navegar diretamente — geralmente entrega pro Chrome.
  try { window.location.href = url; return; } catch (e) {}
  // Último recurso: cria um link temporário e simula o clique nativo
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function linkifyText(rawText) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const parts = rawText.split(urlRegex);
  return parts.map((part, i) => {
    if (i % 2 === 1) {
      // É uma URL
      let display = part;
      try {
        const u = new URL(part);
        display = u.hostname.replace(/^www\./, '') + (u.pathname !== '/' ? u.pathname : '');
      } catch(e) {}
      if (display.length > 40) display = display.slice(0, 38) + '…';
      return `<a class="task-link" href="${part}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation(); event.preventDefault(); openTaskLink('${part.replace(/'/g, "\\'")}');">${esc(display)}</a>`;
    }
    return esc(part);
  }).join('');
}

function renderTaskLabel(text, done) {
  const heart = '🖤';
  const idx = text.indexOf(heart);
  if (idx === -1) return linkifyText(text);
  const before = linkifyText(text.slice(0, idx));
  const after  = linkifyText(text.slice(idx + heart.length));
  return `${before}<span style="opacity:0.2">${heart}</span><span class="heart-secret">${after}</span>`;
}

function makeTaskEl(t) {
  const el = document.createElement('div');
  const urgent = isUrgent(t);
  const todayDue = t.dueDate && isToday(t.dueDate) && !t.done;
  const tomorrowDue = t.dueDate && isTomorrow(t.dueDate) && !t.done;
  const futureDue = t.dueDate && !t.done && t.dueDate > tomorrowStr();
  const overdueDue = t.dueDate && !t.done && t.dueDate < todayStr();
  let cls = 'task' + (t.done ? ' done' : '');
  if (overdueDue) cls += ' overdue';
  else if (todayDue) cls += ' urgent';
  else if (tomorrowDue) cls += ' urgent-tomorrow';
  else if (futureDue) cls += ' urgent-future';
  el.className = cls;
  el.dataset.taskId = t.id;

  // Date badge
  const dateBadge = (t.dueDate && !t.done)
    ? `<span class="task-date-badge ${todayDue ? 'badge-today' : tomorrowDue ? 'badge-tomorrow' : overdueDue ? 'badge-overdue' : 'badge-future'}">${formatDateLabel(t.dueDate)}${t.dueTime ? ' - ' + t.dueTime : ''}</span>`
    : '';

  // ── MAIN ROW (tap = toggle done) ──
  const main = document.createElement('div');
  main.className = 'task-main';
  main.innerHTML = `
    <div class="task-check">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1.5 6 4.5 9 10.5 3"/>
      </svg>
    </div>
    <span class="task-label">${dateBadge}${renderTaskLabel(t.text, t.done)}</span>`;
  el.appendChild(main);

  function updateSecretText(done) {
    // CSS via .task.done .heart-secret já cuida da visibilidade e altura
  }

  function toggleDone(e, fromCheck) {
    if (e && e.target && e.target.closest('.task-photo-zone')) return;
    const task = data.tasks.find(x => x.id === t.id);
    if (!task) return;
    // Tarefa com data sendo concluída (atrasada ou não): pergunta antes
    if (!task.done && task.dueDate) {
      askCompleteOrReschedule(task, () => performToggleDone(task, fromCheck));
      return;
    }
    performToggleDone(task, fromCheck);
  }

  function performToggleDone(task, fromCheck) {
    // Save undo snapshot only when marking as done (most common accident)
    if (!task.done) pushUndo('Concluir: ' + task.text.slice(0, 30));
    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : null;
    lastTouchedId = task.id;
    save();
    el.classList.toggle('done', task.done);
    updateSecretText(task.done);
    updateProgressBars(); // atualiza barrinha ao vivo

    // highlight last action
    clearLastHighlights();
    if (task.done) {
      el.classList.add('last-done');
      lastDoneEl = el;
    } else {
      el.classList.add('last-undone');
      lastUndoneEl = el;
    }

    // Reorder only when tapped from the check circle
    if (fromCheck) {
      const page = el.closest('.page');
      if (!page) return;
      if (task.done) {
        // Ensure divider exists
        let divider = page.querySelector('#done-divider');
        if (!divider) {
          divider = document.createElement('div');
          divider.className = 'done-divider';
          divider.id = 'done-divider';
          divider.textContent = 'Concluídas';
          // Insert divider before the first done task, or at end
          const firstDone = [...page.querySelectorAll('.task.done')].find(n => n !== el);
          if (firstDone) page.insertBefore(divider, firstDone);
          else page.appendChild(divider);
        }
        // Insert newly done task right after the divider
        if (divider.nextSibling) page.insertBefore(el, divider.nextSibling);
        else page.appendChild(el);
        showDoneToast(task.text);
      } else {
        // Newly undone: restore to original position among pending tasks
        // Remove divider if no done tasks remain
        const dividerEl = page.querySelector('#done-divider');
        if (dividerEl && page.querySelectorAll('.task.done').length === 0) dividerEl.remove();
        // pending tasks excluding self, sorted by order desc (newest first = top)
        const otherPending = [...page.querySelectorAll('.task:not(.done)')].filter(n => n !== el);
        const myOrder = task.order ?? 0;
        let inserted = false;
        for (const node of otherPending) {
          const nodeTask = data.tasks.find(x => x.id === node.dataset.taskId);
          // insert before the first node that has lower order (older) than me
          if (nodeTask && (nodeTask.order ?? 0) < myOrder) {
            page.insertBefore(el, node);
            inserted = true;
            break;
          }
        }
        if (!inserted) {
          // I'm the oldest pending — go just before first done, or end
          const firstDone = page.querySelector('.task.done');
          if (firstDone) page.insertBefore(el, firstDone);
          else page.appendChild(el);
        }
      }
    }
  }

  main.addEventListener('click', e => {
    e.stopPropagation();
    if (editMode) {
      openEditModalForTask(t.id);
      return;
    }
    if (deleteMode) {
      openDeleteModalForTask(t.id);
      return;
    }
    // task-check has pointer-events:none so we detect by x position — leftmost ~50px = check zone
    const rect = main.getBoundingClientRect();
    const fromCheck = (e.clientX - rect.left) < 50;
    toggleDone(null, fromCheck);
  });

  // tap on task background (fat mode empty area) — never reorders
  el.addEventListener('click', e => {
    if (editMode) {
      openEditModalForTask(t.id);
      return;
    }
    if (deleteMode) {
      openDeleteModalForTask(t.id);
      return;
    }
    toggleDone(e, false);
  });

  // ── PHOTO ZONE (always present on the right) ──
  const zone = document.createElement('div');
  zone.className = 'task-photo-zone';

  if (t.photo) {
    const isVideo = t.photo.startsWith('data:video') || t.photoType === 'video';
    const thumb = document.createElement('div');
    thumb.className = 'task-thumb';
    if (isVideo) {
      const vid = document.createElement('video');
      vid.src = t.photo; vid.muted = true; vid.playsInline = true;
      vid.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      thumb.appendChild(vid);
      // play icon overlay
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="white" opacity="0.85"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
      thumb.style.position = 'relative';
      thumb.appendChild(overlay);
    } else {
      const img = document.createElement('img');
      img.src = t.photo; img.alt = '';
      thumb.appendChild(img);
    }
    zone.appendChild(thumb);
    zone.addEventListener('click', e => { e.stopPropagation(); openPhotoViewer(t.photo, isVideo, t.id); });
  } else {
    // ghost camera icon
    const ghost = document.createElement('div');
    ghost.className = 'photo-icon-ghost';
    ghost.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>`;
    zone.appendChild(ghost);

    // simple click = pick photo
    zone.addEventListener('click', e => { e.stopPropagation(); pickPhoto(t.id); });
  }

  el.appendChild(zone);
  return el;
}

// ── SWIPE ──
const SWIPE_START = 18;
const SWIPE_COMMIT = 67;
const SWIPE_RESIST = 0.35;

let tx0 = 0, ty0 = 0, swiping = false, base = 0;

outerEl.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  tx0 = touch.clientX; ty0 = touch.clientY;
  base = -cur * window.innerWidth;
  swiping = false;
}, { passive: true });

outerEl.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - tx0;
  const dy = e.touches[0].clientY - ty0;
  if (!swiping) {
    if (Math.abs(dx) < SWIPE_START) return;
    if (Math.abs(dy) > Math.abs(dx) * 0.7) return;
    swiping = true;
  }
  trackEl.style.transition = 'none';
  trackEl.style.transform = `translateX(${base + dx * SWIPE_RESIST}px)`;
}, { passive: true });

outerEl.addEventListener('touchend', e => {
  if (!swiping) return;
  const dx = e.changedTouches[0].clientX - tx0;
  if (dx < -SWIPE_COMMIT && cur < allCats().length - 1) cur++;
  else if (dx > SWIPE_COMMIT && cur > 0) cur--;
  swiping = false;
  trackEl.style.transition = '';
  renderTabs(); renderAvatars(); renderDots(); setTrack(true);
}, { passive: true });

// ── DATE HELPERS ──
function todayStr() {
  const d = new Date(); 
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function tomorrowStr() {
  const d = new Date(); d.setDate(d.getDate()+1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function afterTomorrowStr() {
  const d = new Date(); d.setDate(d.getDate()+2);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isAfterTomorrow(dateStr) { return dateStr === afterTomorrowStr(); }
function isUrgent(task) {
  if (!task.dueDate || task.done) return false;
  return task.dueDate >= todayStr(); // hoje, amanhã, depois de amanhã, e qualquer data futura
}
function isToday(dateStr) { return dateStr === todayStr(); }
function isTomorrow(dateStr) { return dateStr === tomorrowStr(); }
function daysDiffFromToday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const target = new Date(y, m - 1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}
function formatDateLabel(dateStr) {
  if (!dateStr) return '';
  if (isToday(dateStr)) return '📅 HOJE';
  if (isTomorrow(dateStr)) return '📅 AMANHÃ';
  if (isAfterTomorrow(dateStr)) return '📅 DEPOIS DE AMANHÃ';
  const [y,m,d] = dateStr.split('-');
  const diff = daysDiffFromToday(dateStr);
  let suffix = '';
  if (diff > 0) suffix = ` - ${diff} DIA${diff === 1 ? '' : 'S'}`;
  else if (diff < 0) suffix = ` - ATRASADA - HÁ ${Math.abs(diff)} DIA${Math.abs(diff) === 1 ? '' : 'S'}`;
  return '📅 ' + d + '/' + m + '/' + y + suffix;
}

function buildScrollCol(colEl, items, selectedVal, onChange) {
  colEl.innerHTML = '';
  // padding items for scroll snap centering
  ['',''].forEach(() => {
    const pad = document.createElement('div');
    pad.className = 'time-scroll-item';
    pad.style.visibility = 'hidden';
    pad.textContent = '00';
    colEl.appendChild(pad);
  });
  items.forEach(val => {
    const item = document.createElement('div');
    item.className = 'time-scroll-item' + (val === selectedVal ? ' selected' : '');
    item.textContent = val;
    item.addEventListener('click', () => {
      onChange(val);
      // scroll to center this item
      item.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
    colEl.appendChild(item);
  });
  ['',''].forEach(() => {
    const pad = document.createElement('div');
    pad.className = 'time-scroll-item';
    pad.style.visibility = 'hidden';
    pad.textContent = '00';
    colEl.appendChild(pad);
  });
  // scroll to selected
  requestAnimationFrame(() => {
    const sel = colEl.querySelector('.selected');
    if (sel) sel.scrollIntoView({ block: 'center', behavior: 'instant' });
  });
  // on scroll stop, detect selected item
  let scrollTimer;
  colEl.addEventListener('scroll', () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const mid = colEl.scrollTop + colEl.clientHeight / 2;
      let closest = null, minDist = Infinity;
      colEl.querySelectorAll('.time-scroll-item:not([style*="hidden"])').forEach(el => {
        const dist = Math.abs(el.offsetTop + el.offsetHeight / 2 - colEl.offsetTop - mid);
        if (dist < minDist) { minDist = dist; closest = el; }
      });
      if (closest) onChange(closest.textContent);
    }, 80);
  }, { passive: true });
}

const HOURS = Array.from({length:24}, (_,i) => String(i).padStart(2,'0'));
const MINS  = Array.from({length:60}, (_,i) => String(i).padStart(2,'0'));

function initTimePicker(prefix, getTime, setTime) {
  const wrap    = document.getElementById(prefix + '-time-wrap');
  const hourCol = document.getElementById(prefix + '-hour-col');
  const minCol  = document.getElementById(prefix + '-min-col');
  const clearBtn = document.getElementById(prefix + '-time-clear');
  const toggleBtn = document.getElementById(prefix + '-time-toggle');

  function rebuild() {
    const t = getTime();
    const h = t ? t.split(':')[0] : '08';
    const m = t ? t.split(':')[1] : '00';
    buildScrollCol(hourCol, HOURS, h, newH => {
      const cur = getTime() || '08:00';
      setTime(newH + ':' + cur.split(':')[1]);
      rebuild();
    });
    buildScrollCol(minCol, MINS, m, newM => {
      const cur = getTime() || '08:00';
      setTime(cur.split(':')[0] + ':' + newM);
      rebuild();
    });
  }

  clearBtn.addEventListener('click', () => {
    setTime(null);
    wrap.classList.remove('show');
    if (toggleBtn) toggleBtn.style.display = '';
  });

  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      setTime(getTime() || '08:00');
      wrap.classList.add('show');
      toggleBtn.style.display = 'none';
      rebuild();
    });
  }

  return {
    // Chamado quando a data muda. Só exibe o picker automaticamente se já
    // houver um horário definido (ex: editando tarefa que já tinha horário).
    // Caso contrário, mantém escondido e mostra o botão "+ Adicionar horário".
    show: (timeVal, hasDate = true) => {
      if (timeVal) {
        setTime(timeVal);
        wrap.classList.add('show');
        if (toggleBtn) toggleBtn.style.display = 'none';
        rebuild();
      } else {
        wrap.classList.remove('show');
        if (toggleBtn) toggleBtn.style.display = hasDate ? '' : 'none';
      }
    }, hide: () => {
      wrap.classList.remove('show');
      if (toggleBtn) toggleBtn.style.display = 'none';
    }, rebuild };
}

// ── PLAY MODE: percorre tarefas pendentes de uma categoria, uma por vez ──
const playBackdrop      = document.getElementById('play-modal-backdrop');
const playCatNameEl     = document.getElementById('play-cat-name');
const playBody          = document.getElementById('play-body');
const playProgressFill  = document.getElementById('play-progress-fill');
const playProgressLabel = document.getElementById('play-progress-label');
const playCloseBtn      = document.getElementById('play-close-btn');

let playCat = null;
let playQueue = []; // ids das tarefas pendentes na rodada atual
let playSkipped = []; // ids das tarefas puladas nesta rodada (voltam se você escolher "rever")

// No play, aparecem tarefas sem data, atrasadas, de hoje ou de amanhã
function isPlayable(t) {
  return !t.dueDate || t.dueDate <= tomorrowStr();
}

function openPlayMode(cat) {
  playCat = cat;
  const pendingInCat = data.tasks.filter(t => t.cat === cat && !t.done && isPlayable(t));
  playQueue = orderedPending(cat, pendingInCat).map(t => t.id);
  playSkipped = [];
  playCatNameEl.textContent = cat;
  playBackdrop.classList.add('show');
  renderPlayCurrent();
}

function closePlayMode() {
  playBackdrop.classList.remove('show');
  playCat = null;
  playQueue = [];
  playSkipped = [];
  save();
  updateProgressBars();
  renderGrid();
}

playCloseBtn.addEventListener('click', closePlayMode);

function renderPlayCurrent() {
  // Remove da fila quaisquer ids que não existam mais ou já foram concluídos por outra via
  playQueue = playQueue.filter(id => {
    const t = data.tasks.find(x => x.id === id);
    return t && !t.done && isPlayable(t);
  });

  playSkipped = playSkipped.filter(id => {
    const t = data.tasks.find(x => x.id === id);
    return t && !t.done && isPlayable(t);
  });

  const totalInCat = data.tasks.filter(t => t.cat === playCat && isPlayable(t)).length;
  const doneInCat  = data.tasks.filter(t => t.cat === playCat && isPlayable(t) && t.done).length;
  playProgressFill.style.width = totalInCat > 0 ? ((doneInCat / totalInCat) * 100).toFixed(1) + '%' : '0%';
  playProgressLabel.textContent = `${doneInCat} de ${totalInCat} concluídas`;

  playBody.innerHTML = '';

  if (playQueue.length === 0) {
    const hasSkipped = playSkipped.length > 0;
    const overlay = document.createElement('div');
    overlay.className = 'play-end-overlay';
    overlay.innerHTML = `
      <div class="play-end-card">
        <div class="play-end-title">acabou :)</div>
        <div class="play-end-sub">${hasSkipped
          ? (playSkipped.length === 1 ? 'Sobrou 1 tarefa que você pulou.' : `Sobraram ${playSkipped.length} tarefas que você pulou.`)
          : 'Tudo certo por aqui.'}</div>
        <div class="complete-btn-row">
          ${hasSkipped ? '<button class="complete-reschedule-btn" id="play-end-review">rever</button>' : ''}
          <button class="complete-confirm-btn" id="play-end-close">fechar</button>
        </div>
      </div>`;
    playBody.appendChild(overlay);
    overlay.querySelector('#play-end-close').onclick = closePlayMode;
    const reviewBtn = overlay.querySelector('#play-end-review');
    if (reviewBtn) reviewBtn.onclick = () => {
      playQueue = playSkipped.slice();
      playSkipped = [];
      renderPlayCurrent();
    };
    return;
  }

  const taskId = playQueue[0];
  const task = data.tasks.find(x => x.id === taskId);
  if (!task) { renderPlayCurrent(); return; }

  const tapZone = document.createElement('div');
  tapZone.className = 'play-tap-zone';

  const card = document.createElement('div');
  card.className = 'play-task-card entering';

  if (task.photo) {
    const photoWrap = document.createElement('div');
    photoWrap.className = 'play-task-photo';
    if (task.photoType === 'video') {
      photoWrap.innerHTML = `<video src="${task.photo}" muted playsinline autoplay loop></video>`;
    } else {
      photoWrap.innerHTML = `<img src="${task.photo}" alt="">`;
    }
    card.appendChild(photoWrap);
  }

  if (task.dueDate) {
    const dateEl = document.createElement('div');
    const overdueDays = -daysDiffFromToday(task.dueDate);
    const isLate = overdueDays > 0;
    dateEl.className = 'play-task-date' + ((isToday(task.dueDate) || isLate) ? ' is-today' : '');
    let label;
    if (isLate) label = 'ATRASADA · HÁ ' + overdueDays + (overdueDays === 1 ? ' DIA' : ' DIAS');
    else label = isToday(task.dueDate) ? 'HOJE' : 'AMANHÃ';
    dateEl.textContent = label + (task.dueTime ? ' · ' + task.dueTime : '');
    card.appendChild(dateEl);
  }

  const textEl = document.createElement('div');
  textEl.className = 'play-task-text';
  textEl.textContent = task.text;
  card.appendChild(textEl);

  tapZone.appendChild(card);
  tapZone.addEventListener('click', () => completePlayTask(task.id, tapZone, card));
  playBody.appendChild(tapZone);

  {
    const skipBar = document.createElement('div');
    skipBar.className = 'play-skip-bar';
    skipBar.textContent = 'PULAR POR AGORA';
    skipBar.addEventListener('click', (e) => {
      e.stopPropagation();
      skipPlayTask();
    });
    playBody.appendChild(skipBar);
  }
}

function completePlayTask(taskId, tapZone, cardEl) {
  const task = data.tasks.find(x => x.id === taskId);
  if (!task) return;
  // Tarefa com data: pergunta se quer concluir ou remarcar
  if (task.dueDate) {
    askCompleteOrReschedule(task, () => performPlayComplete(task, tapZone, cardEl));
    return;
  }
  performPlayComplete(task, tapZone, cardEl);
}

function performPlayComplete(task, tapZone, cardEl) {
  pushUndo('Concluir: ' + task.text.slice(0, 30));
  task.done = true;
  task.doneAt = Date.now();
  save();
  updateProgressBars();

  tapZone.classList.add('flash-green');
  cardEl.classList.remove('entering');
  cardEl.classList.add('completing');
  setTimeout(() => {
    playQueue.shift();
    renderPlayCurrent();
  }, 380);
}

function skipPlayTask() {
  if (playQueue.length === 0) return;
  playSkipped.push(playQueue.shift());
  renderPlayCurrent();
}

  modalMode = 'task';

  taskInEl.style.display = ''; catLabelEl.style.display = '';
  modalBtn.textContent = 'Adicionar';
  taskInEl.value = prefill;

  const from = cats.indexOf(targetCat);
  if (from === -1) return;

const emojiFilterBtn      = document.getElementById('emoji-filter-btn');
const emojiFilterModal    = document.getElementById('emoji-filter-modal-backdrop');
const filterResultsLabel  = document.getElementById('filter-results-label');
const filterResultsList   = document.getElementById('filter-results-list');
let activeFilterEmoji = null;

function renderFilterResults() {
  filterResultsList.innerHTML = '';
  if (!activeFilterEmoji) { filterResultsLabel.textContent = 'Escolha um emoji acima'; return; }
  const matches = data.tasks.filter(t => !t.done && (
    activeFilterEmoji === '📅' ? !!t.dueDate : t.text.includes(activeFilterEmoji)
  ));
  // Ordem cronológica: com data primeiro (mais próxima primeiro, considerando a hora), sem data no final
  matches.sort((a, b) => {
    if (a.dueDate && !b.dueDate) return -1;
    if (!a.dueDate && b.dueDate) return 1;
    if (!a.dueDate && !b.dueDate) return 0;
    const aKey = a.dueDate + 'T' + (a.dueTime || '00:00');
    const bKey = b.dueDate + 'T' + (b.dueTime || '00:00');
    return aKey.localeCompare(bKey);
  });
  filterResultsLabel.textContent = `${matches.length} tarefa${matches.length === 1 ? '' : 's'} encontrada${matches.length === 1 ? '' : 's'}`;
  if (!matches.length) {
    const empty = document.createElement('div');
    empty.className = 'filter-empty';
    empty.textContent = 'Nenhuma tarefa encontrada.';
    filterResultsList.appendChild(empty);
    return;
  }
  matches.forEach(t => {
    const row = document.createElement('div');
    row.className = 'filter-result-row';
    const circle = document.createElement('div');
    circle.className = 'filter-result-check';
    const textCol = document.createElement('div');
    textCol.style.cssText = 'display:flex; flex-direction:column; gap:3px; min-width:0;';
    const catTag = document.createElement('span');
    catTag.className = 'filter-result-cat';
    catTag.textContent = t.cat;
    const label = document.createElement('span');
    label.innerHTML = linkifyText(t.text);
    textCol.appendChild(catTag);
    textCol.appendChild(label);
    if (t.dueDate) {
      const dateTag = document.createElement('span');
      dateTag.className = 'filter-result-date';
      dateTag.textContent = formatDateLabel(t.dueDate) + (t.dueTime ? ' · ' + t.dueTime : '');
      textCol.appendChild(dateTag);
    }
    row.appendChild(circle);
    row.appendChild(textCol);
    row.addEventListener('click', () => {
      const task = data.tasks.find(x => x.id === t.id);
      if (!task) return;
      const finish = () => {
        task.done = true;
        task.doneAt = Date.now();
        save(); render(); updateProgressBars();
        renderFilterResults();
      };
      if (task.dueDate) {
        askCompleteOrReschedule(task, finish);
      } else {
        finish();
      }
    });
    filterResultsList.appendChild(row);
  });
}

  activeFilterEmoji = null;
  document.querySelectorAll('.filter-emoji-big').forEach(b => b.classList.remove('active'));
  renderFilterResults();

let addPinActive = false;

const modalPinBtn = document.getElementById('modal-pin-btn');

const QUICK_EMOJIS = ['📅','🌍','📱','🎒','🏠'];
function shakeEmojiRow(rowEl) {
  rowEl.classList.remove('shake');
  void rowEl.offsetWidth; // força reflow pra reiniciar a animação
  rowEl.classList.add('shake');
  setTimeout(() => rowEl.classList.remove('shake'), 420);
}
function toggleQuickEmoji(textareaEl, emoji, rowEl) {
  let val = textareaEl.value;
  const trimmedStart = val.replace(/^\s+/, '');
  if (trimmedStart.startsWith(emoji)) {
    // já tem esse emoji no início — remove
    val = trimmedStart.slice(emoji.length).replace(/^\s+/, '');
  } else {
    // remove qualquer outro emoji rápido que já esteja no início, depois adiciona o novo
    let stripped = trimmedStart;
    for (const e of QUICK_EMOJIS) {
      if (stripped.startsWith(e)) { stripped = stripped.slice(e.length).replace(/^\s+/, ''); break; }
    }
    val = emoji + ' ' + stripped;
  }
  textareaEl.value = val;
  textareaEl.style.height = 'auto';
  textareaEl.style.height = textareaEl.scrollHeight + 'px';
  updateQuickEmojiSelection(textareaEl, rowEl);

document.getElementById('fix-sort-chip').addEventListener('click', e => {
  e.stopPropagation();
  if (!lastTouchedId) { emojiSortPanel.classList.remove('show'); return; }
  const task = data.tasks.find(t => t.id === lastTouchedId);
  if (!task) { emojiSortPanel.classList.remove('show'); return; }
  const cat = task.cat;
  // Give it an order higher than all others in its category
  const catTasks = data.tasks.filter(t => t.cat === cat);
  const maxOrder = Math.max(...catTasks.map(t => t.order || 0), 0);
  task.order = maxOrder + 100000;
  save(); render();
  emojiSortPanel.classList.remove('show');
  showDoneToast('Tarefa fixada no topo!');
});
document.querySelectorAll('.emoji-sort-chip').forEach(chip => {
  chip.addEventListener('click', e => {
    e.stopPropagation();
    const emoji = chip.dataset.emoji;
    const cat = (gridMode && lastSelectedGridCat) ? lastSelectedGridCat : allCats()[cur];

    if (emoji === '📅') {
      const SPECIAL = ['🌍','📱','🏠','🎒'];
      const FAR_FUTURE = '9999-12-31';
      const catPending = data.tasks.filter(t => t.cat === cat && !t.done);
      const catOthers  = data.tasks.filter(t => !(t.cat === cat && !t.done));
      // Sem emoji ficam no topo, depois ordena por data
      catPending.sort((a, b) => {
        const aNoEmoji = !SPECIAL.some(e => a.text.includes(e)) && !a.dueDate;
        const bNoEmoji = !SPECIAL.some(e => b.text.includes(e)) && !b.dueDate;
        if (aNoEmoji && !bNoEmoji) return -1;
        if (!aNoEmoji && bNoEmoji) return 1;
        const da = a.dueDate || FAR_FUTURE;
        const db = b.dueDate || FAR_FUTURE;
        return da < db ? -1 : da > db ? 1 : 0;
      });
      const baseOrder = Date.now() + catPending.length * 1000;
      catPending.forEach((t, i) => { t.order = baseOrder - i * 100; });
      data.tasks = [...catPending, ...catOthers];
    } else {
      // Pendentes desta categoria que contêm o emoji
      const matching = data.tasks.filter(t => t.cat === cat && !t.done && t.text.includes(emoji));
      const others   = data.tasks.filter(t => !(t.cat === cat && !t.done && t.text.includes(emoji)));
      const baseOrder = Date.now() + matching.length * 1000;
      matching.forEach((t, i) => { t.order = baseOrder - i * 100; });
      data.tasks = [...matching, ...others];
    }

    // Marca a categoria como organizada manualmente, para os comandos
    // 🏠🎒📅🌍 realmente valerem (sem serem sobrescritos pela ordenação automática por data)
    if (!data.manualOrderCats) data.manualOrderCats = [];
    if (!data.manualOrderCats.includes(cat)) data.manualOrderCats.push(cat);

    save(); render();
    emojiSortPanel.classList.remove('show');
  });
});

exportBtn.addEventListener('click', async () => {
  // Tarefas "novas" voltam ao seu lugar normal ao baixar o backup
  if (clearJustAdded()) { save(); render(); }
  const payload = JSON.stringify(data, null, 2);
  const today = new Date();
  const dd = String(today.getDate()).padStart(2,'0');
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const yyyy = today.getFullYear();
  const defaultName = `tarefas___${dd}-${mm}-${yyyy}.json`;

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: defaultName,
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(payload);
      await writable.close();
      showDoneToast('Backup salvo!');
    } catch (e) {
      if (e.name !== 'AbortError') {
        // fallback se der erro
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = defaultName; a.click();
        URL.revokeObjectURL(url);
      }
    }
  } else {
    // fallback para browsers sem suporte
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = defaultName; a.click();
    URL.revokeObjectURL(url);
  }
});

importBtn.addEventListener('click', () => {
  importFileIn.value = '';
  importFileIn.click();
});

importFileIn.addEventListener('change', () => {
  const file = importFileIn.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.tasks || !imported.cats) throw new Error('Formato inválido');
      // Merge: add imported tasks/cats that don't exist yet
      const LEGACY_CATS = ['Pessoal', 'Trabalho', 'Saúde'];
      imported.cats.forEach(c => {
        if (LEGACY_CATS.includes(c) && !imported.tasks.some(t => t.cat === c)) return;
        if (!data.cats.includes(c)) data.cats.push(c);
      });
      const existingIds = new Set(data.tasks.map(t => t.id));
      imported.tasks.forEach((t, i) => {
        // Normaliza campos que podem estar ausentes em backups antigos
        if (!t.id) t.id = uid();
        if (t.photo === undefined) t.photo = null;
        if (t.doneAt === undefined) t.doneAt = null;
        if (t.order === undefined) t.order = Date.now() - i * 1000;
        if (t.dueDate === undefined) t.dueDate = null;
        if (t.dueTime === undefined) t.dueTime = null;

        // Não carregar progresso do backup, exceto na categoria fixa TAREFAS
        if (t.cat !== 'TAREFAS') {
          t.done = false;
          t.doneAt = null;
        }

        if (!existingIds.has(t.id)) {
          // Tarefa nova: adiciona
          data.tasks.push(t);
        } else {
          // Tarefa já existe: atualiza campos (exceto foto, que pode ser pesada e já estar local)
          const existing = data.tasks.find(x => x.id === t.id);
          if (existing) {
            existing.text    = t.text;
            existing.cat     = t.cat;
            existing.done    = t.done;
            existing.doneAt  = t.doneAt;
            existing.order   = t.order;
            existing.dueDate = t.dueDate;
            existing.dueTime = t.dueTime;
            // Só sobrescreve foto se o backup tiver uma e o local não tiver
            if (t.photo && !existing.photo) {
              existing.photo     = t.photo;
              existing.photoType = t.photoType;
            }
          }
        }
      });
      // Merge avatares
      if (imported.catAvatars) {
        if (!data.catAvatars) data.catAvatars = {};
        Object.entries(imported.catAvatars).forEach(([cat, photo]) => {
          if (!data.catAvatars[cat]) data.catAvatars[cat] = photo;
        });
      }
      // Tarefas "novas" voltam ao seu lugar normal ao importar
      clearJustAdded();
      save();
      cur = 0;
      render();
      showDoneToast('Importação concluída!');
    } catch(err) {
      alert('Erro ao importar: arquivo inválido.');
    }
  };
  reader.readAsText(file);
});

function renderCatFs(cat) {
  const tasks = data.tasks.filter(t => t.cat === cat);
  const pending = tasks.filter(t => !t.done);
  const done    = tasks.filter(t => t.done).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));

  catFsList.innerHTML = '';

  orderedPending(cat, pending).forEach(t => catFsList.appendChild(makeFsCard(t, cat)));

    const sep = document.createElement('div');
    sep.className = 'cat-fs-done-sep';

function makeFsCard(t, cat) {
  const card = document.createElement('div');
  card.className = 'kanban-card' + (t.done ? ' is-done' : '');

  const check = document.createElement('div');
  check.className = 'kanban-check';
  check.innerHTML = `<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5 6 4.5 9 10.5 3"/></svg>`;

  const textWrap = document.createElement('div');
  textWrap.className = 'kanban-text';

  if (t.dueDate && !t.done) {
    const today = isToday(t.dueDate), tmrw = isTomorrow(t.dueDate);
    const overdue = t.dueDate < todayStr();
    if (today || tmrw || overdue) {
      const badge = document.createElement('div');
      badge.className = 'kanban-date-badge';
      badge.style.background = overdue ? '#ffd600' : '#e84040';
      badge.style.color = overdue ? '#7a5a00' : '#fff';
      badge.textContent = today ? 'HOJE' : tmrw ? 'AMANHÃ' : 'ATRASADA';
      textWrap.appendChild(badge);
    }
  }
  const fsTextSpan = document.createElement('span');
  fsTextSpan.innerHTML = linkifyText(t.text);
  textWrap.appendChild(fsTextSpan);

  card.appendChild(check);
  card.appendChild(textWrap);
  const thumbZone1 = makePhotoThumbIfAny(t);
  if (thumbZone1) card.appendChild(thumbZone1);

  function performFsToggle(task) {
    lastTouchedCat = task.cat;
    if (!task.done) pushUndo('Concluir: ' + task.text.slice(0, 30));
    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : null;
    t.done = task.done; t.doneAt = task.doneAt;
    save();
    updateProgressBars();
    if (task.done) {
      const taskId = task.id;
      const taskText = task.text;
      queueDoneToast(taskText, () => {
        const t2 = data.tasks.find(x => x.id === taskId);
        if (!t2) return;
        t2.done = false;
        t2.doneAt = null;
        t2.completedAt = null;
        save(); updateProgressBars(); renderCatFs(cat);
      });
      card.classList.add('completing');
      setTimeout(() => renderCatFs(cat), 500);
    } else {
      card.classList.add('popping');
      setTimeout(() => renderCatFs(cat), 220);
    }
  }

  card.addEventListener('click', () => {
    const task = data.tasks.find(x => x.id === t.id);
    if (!task) return;
    // Tarefa com data sendo concluída (atrasada ou não): pergunta antes
    if (!task.done && task.dueDate) {
      askCompleteOrReschedule(task, () => performFsToggle(task));
      return;
    }
    performFsToggle(task);
  });

  return card;
}

  if (overdue) cardClass += ' overdue';

  check.innerHTML = `<svg width="8" height="8" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5 6 4.5 9 10.5 3"/></svg>`;

  const textWrap = document.createElement('div');
  textWrap.className = 'kanban-text';

  if (t.dueDate && !t.done) {
    if (todayDue || tmrwDue || futureDue || overdue) {
      const badge = document.createElement('div');
      badge.className = 'kanban-date-badge';
      badge.style.background = overdue ? '#ffd600' : '#e84040';
      badge.style.color = overdue ? '#7a5a00' : '#fff';
      badge.textContent = todayDue ? 'HOJE' : tmrwDue ? 'AMANHÃ' : overdue ? `ATRASADA - HÁ ${Math.abs(daysDiffFromToday(t.dueDate))} DIA${Math.abs(daysDiffFromToday(t.dueDate)) === 1 ? '' : 'S'}` : isAfterTomorrow(t.dueDate) ? 'DEPOIS DE AMANHÃ' : formatDateLabel(t.dueDate);
      textWrap.appendChild(badge);
    }
  }
  const gridTextSpan = document.createElement('span');
  gridTextSpan.innerHTML = linkifyText(t.text);
  textWrap.appendChild(gridTextSpan);

  card.appendChild(check);
  card.appendChild(textWrap);
  const thumbZone2 = makePhotoThumbIfAny(t);
  if (thumbZone2) card.appendChild(thumbZone2);

  // Tap → unlock this category's scroll, lock all others
  card.addEventListener('click', () => {
    lastTouchedCat = cat;
    if (editMode) {
      openEditModalForTask(t.id);
      return;
    }
    if (deleteMode) {
      openDeleteModalForTask(t.id);
      return;
    }
    unlockedCat = cat;
    document.querySelectorAll('.kanban-col-body').forEach(b => b.classList.remove('unlocked'));
    const parentBody = card.closest('.kanban-col-body');
    if (parentBody) parentBody.classList.add('unlocked');
    const task = data.tasks.find(x => x.id === t.id);
    if (!task) return;
    // Tarefa com data sendo concluída (atrasada ou não): pergunta antes
    if (!task.done && task.dueDate) {
      askCompleteOrReschedule(task, () => performGridToggle(task));
      return;
    }
    performGridToggle(task);
  });

  function performGridToggle(task) {
    if (!task.done) pushUndo('Concluir: ' + task.text.slice(0, 30));
    task.done = !task.done;
    task.doneAt = task.done ? Date.now() : null;
    t.done = task.done; t.doneAt = task.doneAt;
    save();
    updateProgressBars();
    if (task.done) {
      const taskId = task.id;
      const taskText = task.text;
      queueDoneToast(taskText, () => {
        const t2 = data.tasks.find(x => x.id === taskId);
        if (!t2) return;
        t2.done = false;
        t2.doneAt = null;
        t2.completedAt = null;
        unlockedCat = cat;
        // Save all scroll positions before re-render
        const scrollMap = {};
        document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
          scrollMap[b.dataset.cat] = b.scrollTop;
        });
        save(); updateProgressBars();
        renderGrid();
        // Restore scroll positions and flash the card
        requestAnimationFrame(() => {
          document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
            if (scrollMap[b.dataset.cat]) b.scrollTop = scrollMap[b.dataset.cat];
          });
          const restoredCard = document.querySelector(`[data-task-id="${taskId}"]`);
          if (restoredCard) {
            restoredCard.classList.add('flashing');
            restoredCard.addEventListener('animationend', () => restoredCard.classList.remove('flashing'), { once: true });
          }
        });
      });
      card.classList.add('completing');
      setTimeout(() => {
        const scrollMap = {};
        document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
          scrollMap[b.dataset.cat] = b.scrollTop;
        });
        renderGrid();
        requestAnimationFrame(() => {
          document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
            if (scrollMap[b.dataset.cat]) b.scrollTop = scrollMap[b.dataset.cat];
          });
        });
      }, 500);
    } else {
      card.classList.add('popping');
      setTimeout(() => {
        const scrollMap = {};
        document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
          scrollMap[b.dataset.cat] = b.scrollTop;
        });
        renderGrid();
        requestAnimationFrame(() => {
          document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
            if (scrollMap[b.dataset.cat]) b.scrollTop = scrollMap[b.dataset.cat];
          });
        });
      }, 220);
    }
  }

  return card;
}

// ── AUTO-RESET SCROLL when entire category leaves viewport ──
function attachScrollReset(body, col) {
  if (!body || !col) return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) {
        body.scrollTop = 0;
      }
    });
  }, { threshold: 0 });
  obs.observe(col);
}

// ── BUSCA ──
const searchBtn      = document.getElementById('search-btn');
const searchBar      = document.getElementById('search-bar');
const searchInput    = document.getElementById('search-input');
const searchClearBtn = document.getElementById('search-clear-btn');
let searchActive = false;
let searchQuery  = '';

function applySearch() {
  const q = searchQuery.trim().toLowerCase();
  document.querySelectorAll('.task, .kanban-card').forEach(el => {
    if (!q) { el.style.display = ''; return; }
    const taskId = el.dataset.taskId;
    const task = taskId ? data.tasks.find(t => t.id === taskId) : null;
    const text = task ? task.text.toLowerCase() : el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? '' : 'none';
  });
}

searchBtn.onclick = () => {
  searchActive = !searchActive;
  searchBtn.classList.toggle('search-active', searchActive);
  searchBar.style.display = searchActive ? 'block' : 'none';
  if (searchActive) {
    searchInput.focus();
  } else {
    searchQuery = '';
    searchInput.value = '';
    applySearch();
  }
};

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  applySearch();
});

searchClearBtn.addEventListener('click', () => {
  searchQuery = '';
  searchInput.value = '';
  searchInput.focus();
  applySearch();
});

// ── BLOQUEAR ATUALIZAÇÃO DE PÁGINA ──
document.addEventListener('keydown', e => {
  if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.metaKey && e.key === 'r')) {
    e.preventDefault();
  }
});

// ── MIDNIGHT AUTO-UNCHECK (all categories except TAREFAS) ──
let lastCheckedDay = new Date().toDateString();
function midnightCheck() {
  const today = new Date().toDateString();
  if (today !== lastCheckedDay) {
    lastCheckedDay = today;
    // Desmarca todas as tarefas concluídas, exceto categoria TAREFAS
    let changed = false;
    data.tasks.forEach(t => {
      if (t.done && t.cat !== 'TAREFAS') {
        t.done = false;
        t.doneAt = null;
        changed = true;
      }
    });
    if (changed) { save(); render(); }
  }
}
setInterval(midnightCheck, 8 * 60 * 1000); // checa a cada 8 minutos
// Bloqueia beforeunload para avisar se tentar fechar/atualizar
window.addEventListener('beforeunload', e => {
  e.preventDefault();
  e.returnValue = '';
});


// ── MENU: toque no fundo mostra/oculta os botões (editar e excluir ficam sempre) ──
document.addEventListener('click', e => {
  const bg = e.target.matches(
    'html, body, .layout, header, .header-row, #grid-home, #grid-home-inner, .grid-col, ' +
    '.grid-dead-zone, .page, .carousel-outer, .carousel-track, .tabs-scroll, .cat-avatars, ' +
    '.dots, .empty, #add-bar'
  );
  if (!bg) return;
  document.body.classList.toggle('menu-hidden');
  emojiSortPanel.classList.remove('show');
});

// ── BACKUP AUTOMÁTICO (só liga dentro do app Android/Capacitor) ──
const NATIVE_APP = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
const BK_DIR = 'Tarefas';
const BK_FILES = ['autosave-tarefas-1.json', 'autosave-tarefas-2.json'];
let bkTimer = null, bkSlot = 0, bkPermAsked = false, bkBusy = false;

function fsPlugin() { return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem; }
function dataIsEmpty(d) { return !d || !d.tasks || d.tasks.length === 0; }

async function bkWrite(name, text) {
  const fs = fsPlugin();
  try {
    await fs.writeFile({ path: BK_DIR + '/' + name, data: text, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true });
  } catch (e) {
    // Sem acesso à pasta Documents: guarda na pasta interna do app
    await fs.writeFile({ path: BK_DIR + '/' + name, data: text, directory: 'DATA', encoding: 'utf8', recursive: true });
  }
}

async function doBackup() {
  if (!NATIVE_APP) return;
  const fs = fsPlugin();
  if (!fs || dataIsEmpty(data)) return; // nunca grava vazio por cima de uma cópia boa
  if (bkBusy) { scheduleBackup(); return; }
  bkBusy = true;
  try {
    if (!bkPermAsked) { bkPermAsked = true; try { await fs.requestPermissions(); } catch (e) {} }
    const text = JSON.stringify({ ...data, _savedAt: Date.now() });
    bkSlot = 1 - bkSlot; // alterna entre as duas cópias
    await bkWrite(BK_FILES[bkSlot], text);
  } catch (e) { console.warn('Backup falhou', e); }
  bkBusy = false;
}

function scheduleBackup() {
  if (!NATIVE_APP) return;
  clearTimeout(bkTimer);
  bkTimer = setTimeout(doBackup, 4000);
}

async function restoreIfEmpty() {
  if (!NATIVE_APP || !dataIsEmpty(data)) return;
  const fs = fsPlugin();
  if (!fs) return;
  let best = null;
  for (const dir of ['DOCUMENTS', 'DATA']) {
    for (const f of BK_FILES) {
      try {
        const r = await fs.readFile({ path: BK_DIR + '/' + f, directory: dir, encoding: 'utf8' });
        const obj = JSON.parse(r.data);
        if (obj && Array.isArray(obj.cats) && Array.isArray(obj.tasks) && obj.tasks.length &&
            (!best || (obj._savedAt || 0) > (best._savedAt || 0))) best = obj;
      } catch (e) {}
    }
  }
  if (!best) return;
  delete best._savedAt;
  data = best;
  if (!data.cats.includes('TAREFAS')) data.cats.unshift('TAREFAS');
  if (!data.catAvatars) data.catAvatars = {};
  if (!data.collapsedCats) data.collapsedCats = [];
  if (!data.manualOrderCats) data.manualOrderCats = [];
  data.tasks.forEach((t, i) => {
    if (!t.id) t.id = uid();
    if (t.photo === undefined) t.photo = null;
    if (t.photoType === undefined) t.photoType = (t.photo && t.photo.startsWith('data:video')) ? 'video' : 'image';
    if (t.doneAt === undefined) t.doneAt = null;
    if (t.order === undefined) t.order = Date.now() - i * 1000;
    if (t.dueDate === undefined) t.dueDate = null;
    if (t.dueTime === undefined) t.dueTime = null;
  });
  clearJustAdded();
  save();
  setTimeout(() => showDoneToast('Dados restaurados do backup'), 600);
}

// Ao minimizar o app, grava na hora (sem esperar os 4 segundos)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && NATIVE_APP) { clearTimeout(bkTimer); doBackup(); }
});

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}

// ── CARREGAR ESTADO SALVO ──
openDB().then(db => {
  return new Promise(resolve => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(DB_KEY);
    req.onsuccess = () => {
      const saved = req.result;
      if (saved && saved.cats) {
        data = saved;
        // Garantir que a categoria TAREFAS existe
        if (!data.cats.includes('TAREFAS')) data.cats.unshift('TAREFAS');
        // Garantir catAvatars existe
        if (!data.catAvatars) data.catAvatars = {};
        // Garantir collapsedCats existe
        if (!data.collapsedCats) data.collapsedCats = [];
        // Garantir manualOrderCats existe (categorias organizadas manualmente pelo botão 🌍)
        if (!data.manualOrderCats) data.manualOrderCats = [];
        // Garantir campos novos em tarefas antigas
        data.tasks.forEach((t, i) => {
          if (!t.id) t.id = uid();
          if (t.photo === undefined) t.photo = null;
          if (t.photoType === undefined) t.photoType = (t.photo && t.photo.startsWith('data:video')) ? 'video' : 'image';
          if (t.doneAt === undefined) t.doneAt = null;
          if (t.order === undefined) t.order = Date.now() - i * 1000;
          if (t.dueDate === undefined) t.dueDate = null;
          if (t.dueTime === undefined) t.dueTime = null;
        });
        // Tarefas "novas" voltam ao seu lugar normal após atualizar a página
        if (clearJustAdded()) save();
      }
      resolve();
    };
    req.onerror = () => resolve();
  });
}).catch(() => {}).then(() => restoreIfEmpty()).catch(() => {}).finally(() => {
  cur = Math.max(0, allCats().indexOf('TAREFAS'));
  render();
  setGridMode(true); // start in grid view
});

// Salva ao fechar/minimizar
let hiddenAt = null;
const REOPEN_RESET_MS = 5 * 60 * 1000; // só volta pro topo se ficou fora 5+ minutos
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    hiddenAt = Date.now();
    save();
  }
  if (document.visibilityState === 'visible') {
    midnightCheck();
    const away = hiddenAt ? (Date.now() - hiddenAt) : 0;
    hiddenAt = null;
    if (away >= REOPEN_RESET_MS) {
      // Ficou fora tempo suficiente: comportamento normal (pode voltar ao topo)
      render();
    } else {
      // Voltou rápido (ex: só deu uma olhada na home): preserva posição/scroll atual
      renderTabs(); renderAvatars(); renderDots();
      if (editMode) document.querySelectorAll('.task').forEach(el => el.classList.add('edit-mode-hover'));
      if (deleteMode) document.querySelectorAll('.task').forEach(el => el.classList.add('delete-mode-hover'));
      if (searchActive && searchQuery) requestAnimationFrame(applySearch);
    }
  }
});

// Checa datas a cada 5 minutos (útil se o app ficar aberto à meia-noite)
setInterval(() => render(), 5 * 60 * 1000);

// Volta para TAREFAS a cada 7 minutos (só enquanto o app está visível/em uso)
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  const idx = allCats().indexOf('TAREFAS');
  if (idx !== -1 && cur !== idx) goTo(idx);
}, 7 * 60 * 1000);
</script>
