<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tarefas</title>
    <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e84040" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tarefas" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Bloqueia pull-to-refresh */
    html { overscroll-behavior-y: none; }


    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --red: #e84040;
      --red-soft: #ffffff;
      --red-border: #ffd6d6;
      --green: #2e9e5b;
      --green-soft: #f0fdf4;
      --green-border: #c3f0d5;
      --text: #1a1a1a;
      --muted: #b0b0b0;
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      overflow: hidden;
      text-transform: uppercase;
    }

    .layout { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── HEADER ── */
    header { padding: 52px 24px 0; background: var(--bg); flex-shrink: 0; }
    .header-row {
      display: flex; align-items: flex-end;
      justify-content: space-between; margin-bottom: 18px;
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 30px; font-weight: 400; letter-spacing: -0.5px;
    }
    #clear-btn, #grade-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 7px 14px;
      font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.12s;
    }
    /* Oculto a pedido do usuário — mantém a função no código, só some da UI.
       Para reexibir, remova esta regra. */
    #grade-btn { display: none !important; }
    #clear-btn { color: var(--green); }
    #grade-btn { color: var(--muted); }
    #grade-btn.active { color: var(--text); border-color: #c8c8c8; background: #f0eeeb; }
    #clear-btn:active, #grade-btn:active { transform: scale(0.93); }
    #export-btn, #import-btn, #edit-btn, #delete-btn, #undo-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 7px 14px;
      font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.12s;
      color: var(--muted);
    }
    #export-btn:active, #import-btn:active, #edit-btn:active, #delete-btn:active, #undo-btn:active { transform: scale(0.93); }
    #undo-btn { color: #7c3aed; }
    #undo-btn:disabled { opacity: 0.32; pointer-events: none; }
    #export-btn { color: #2563eb; }

    /* ── MOVER CATEGORIA (última tocada) ── */
    #cat-move-left-btn, #cat-move-right-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 7px 10px;
      font-size: 14px; cursor: pointer; line-height: 1;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.12s;
    }
    #cat-move-left-btn:active, #cat-move-right-btn:active { transform: scale(0.88); }

    #today-display-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 6px 16px;
      font-family: 'DM Sans', sans-serif; font-weight: 700;
      cursor: default; pointer-events: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      display: flex; flex-direction: column; align-items: center;
      line-height: 1.2; color: var(--text);
    }
    #today-display-btn .td-day { font-size: 13px; font-weight: 700; }
    #today-display-btn .td-month { font-size: 11px; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }

    /* ── EMOJI SORT ── */
    #emoji-sort-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 7px 14px;
      font-size: 14px; cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.12s;
    }
    #emoji-sort-btn:active { transform: scale(0.93); }
    #emoji-sort-panel {
      display: none;
      position: absolute; top: calc(100% + 8px); left: 0;
      background: #fff; border-radius: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
      padding: 10px 12px; gap: 8px;
      flex-direction: column;
      z-index: 200;
    }
    #emoji-sort-panel.show { display: flex; }
    .emoji-sort-chip {
      font-size: 22px; background: #f5f5f5; border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 6px 10px;
      cursor: pointer; transition: transform 0.12s, background 0.12s;
      line-height: 1;
    }
    .emoji-sort-chip:active { transform: scale(0.88); }
    .emoji-sort-chip.active { background: var(--text); border-color: var(--text); }
    #import-btn { color: #7c3aed; }
    #emoji-filter-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 7px 14px;
      font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.12s;
      color: #0d9488;
    }
    #emoji-filter-btn:active { transform: scale(0.93); }

    /* ── FILTRAR POR EMOJI (popup) ── */
    #emoji-filter-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.22);
      z-index: 100; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 60px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    #emoji-filter-modal-backdrop.show { opacity: 1; pointer-events: all; }
    #emoji-filter-modal-backdrop .modal {
      border-radius: 24px; width: calc(100% - 32px); max-width: 480px;
      max-height: 80vh; overflow-y: auto;
      transform: translateY(-20px); transition: transform 0.26s cubic-bezier(0.4,0,0.2,1);
    }
    #emoji-filter-modal-backdrop.show .modal { transform: translateY(0); }
    .filter-emoji-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .filter-emoji-big {
      flex: 1 1 18%; min-width: 52px; font-size: 24px; line-height: 1; padding: 12px 0;
      background: var(--bg); border: 1.5px solid #e8e8e8; border-radius: 18px;
      cursor: pointer; transition: transform 0.12s, background 0.12s, border-color 0.12s;
    }
    .filter-emoji-big:active { transform: scale(0.92); }
    .filter-emoji-big.active { background: #1a1a1a; border-color: #1a1a1a; }
    .filter-results-label {
      font-size: 11px; letter-spacing: 0.04em; color: var(--muted);
      margin-bottom: 8px; min-height: 14px;
    }
    .filter-results-list { display: flex; flex-direction: column; gap: 8px; }
    .filter-result-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border: 1.5px solid #e8e8e8; border-radius: 14px;
      background: var(--bg); cursor: pointer; transition: transform 0.1s;
    }
    .filter-result-row:active { transform: scale(0.98); }
    .filter-result-check {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid #d8d8d8;
    }
    .filter-result-row span { font-size: 13px; line-height: 1.4; text-transform: uppercase; }
    .filter-result-cat {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
      color: var(--muted);
    }
    .filter-result-date {
      font-size: 11px; font-weight: 600; color: #b5442e;
      text-transform: none;
    }
    .filter-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 0; }
    #search-btn { color: #0ea5e9; }
    #search-btn.search-active { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }
    #edit-btn { color: #d97706; }
    #edit-btn.edit-mode-active { background: #d97706; border-color: #d97706; color: #fff; }
    .task.edit-mode-hover { cursor: pointer; outline: 2px dashed #d97706; outline-offset: 2px; }
    #delete-btn.delete-mode-active { background: var(--red); border-color: var(--red); color: #fff; }
    .task.delete-mode-hover { cursor: pointer; outline: 2px dashed var(--red); outline-offset: 2px; }
    #delete-btn { color: var(--red); }

    /* ── EDIT MODAL ── */
    #edit-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.22);
      z-index: 700; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 60px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    #edit-modal-backdrop.show { opacity: 1; pointer-events: all; }
    #edit-modal-backdrop .modal {
      border-radius: 24px; width: calc(100% - 32px); max-width: 480px;
      max-height: 80vh; overflow-y: auto;
      transform: translateY(-20px); transition: transform 0.26s cubic-bezier(0.4,0,0.2,1);
    }
    #edit-modal-backdrop.show .modal { transform: translateY(0); }
    .edit-photo-zone {
      width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
      border: 1.5px dashed #d8d8d8; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden; -webkit-tap-highlight-color: transparent;
      transition: transform 0.13s, border-color 0.13s;
    }
    .edit-photo-zone:active { transform: scale(0.93); }
    .edit-photo-zone.has-photo { border-style: solid; border-color: #e8e8e8; }
    .edit-photo-zone img, .edit-photo-zone video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── DELETE CONFIRM MODAL ── */
    #delete-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.22);
      z-index: 100; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 60px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    #delete-modal-backdrop.show { opacity: 1; pointer-events: all; }
    #delete-modal-backdrop .modal {
      border-radius: 24px; width: calc(100% - 32px); max-width: 480px;
      transform: translateY(-20px); transition: transform 0.26s cubic-bezier(0.4,0,0.2,1);
    }
    #delete-modal-backdrop.show .modal { transform: translateY(0); }
    .delete-confirm-text { font-size: 14px; color: #555; margin-bottom: 18px; line-height: 1.5; }
    .delete-task-name { font-weight: 600; color: var(--text); }
    .delete-btn-row { display: flex; gap: 10px; }
    .delete-cancel-btn {
      flex: 1; padding: 14px; border-radius: 50px;
      border: 1.5px solid #e8e8e8; background: var(--surface);
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; color: var(--muted); transition: transform 0.12s;
    }
    .delete-cancel-btn:active { transform: scale(0.97); }
    .delete-confirm-btn {
      flex: 1; padding: 14px; border-radius: 50px; background: var(--red);
      border: none; color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: transform 0.12s;
    }
    .delete-confirm-btn:active { transform: scale(0.97); }

    /* ── CONCLUIR/REMARCAR MODAL ── */
    #complete-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.22);
      z-index: 700; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 60px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    #complete-modal-backdrop.show { opacity: 1; pointer-events: all; }
    #complete-modal-backdrop .modal {
      border-radius: 24px; width: calc(100% - 32px); max-width: 480px;
      transform: translateY(-20px); transition: transform 0.26s cubic-bezier(0.4,0,0.2,1);
    }
    #complete-modal-backdrop.show .modal { transform: translateY(0); }
    /* ── REMARCAR (só calendário) ── */
    #reschedule-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.22);
      z-index: 700; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 60px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    #reschedule-modal-backdrop.show { opacity: 1; pointer-events: all; }
    #reschedule-modal-backdrop .modal {
      border-radius: 24px; width: calc(100% - 32px); max-width: 480px;
      transform: translateY(-20px); transition: transform 0.26s cubic-bezier(0.4,0,0.2,1);
    }
    #reschedule-modal-backdrop.show .modal { transform: translateY(0); }
    .resched-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .resched-old { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 16px; }
    .resched-old.replaced { text-decoration: line-through; color: #aaa; }
    .resched-new { font-size: 14px; font-weight: 700; color: var(--green); margin-top: 10px; min-height: 18px; }
    #reschedule-confirm-btn:disabled { opacity: 0.35; cursor: default; }
    #reschedule-date-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #e8e8e8; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: 16px;
      background: var(--bg); color: var(--text); outline: none;
    }
    .complete-confirm-text { font-size: 14px; color: #555; margin-bottom: 18px; line-height: 1.5; }
    .complete-task-name { font-weight: 600; color: var(--text); }
    .complete-btn-row { display: flex; gap: 10px; }
    .complete-reschedule-btn {
      flex: 1; padding: 14px; border-radius: 50px;
      border: 1.5px solid #e8e8e8; background: var(--surface);
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; color: var(--text); transition: transform 0.12s;
    }
    .complete-reschedule-btn:active { transform: scale(0.97); }
    .complete-confirm-btn {
      flex: 1; padding: 14px; border-radius: 50px; background: var(--green);
      border: none; color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: transform 0.12s;
    }
    .complete-confirm-btn:active { transform: scale(0.97); }


    /* ── TABS ── */
    .tabs-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0; padding: 7px 16px; border-radius: 50px;
      font-size: 13px; font-weight: 500; background: transparent;
      border: 1.5px solid #e0e0e0; color: var(--muted);
      cursor: pointer; transition: all 0.18s; white-space: nowrap;
    }
    .tab.active { background: var(--text); border-color: var(--text); color: #fff; }
    .tab-add {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px dashed #c8c8c8; background: transparent; color: var(--muted);
      font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s;
    }
    .tab-add:active { transform: scale(0.9); }
    /* ── CAT AVATARS ── */
    .cat-avatars {
      display: flex; gap: 23px; padding: 10px 4px 0;
      overflow-x: auto; scrollbar-width: none;
    }
    .cat-avatars::-webkit-scrollbar { display: none; }
    .cat-avatar-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; flex-shrink: 0; cursor: pointer;
    }
    .cat-avatar {
      width: 74px; height: 74px; border-radius: 50%;
      background: #e8e8e8;
      border: 2.5px solid #e0e0e0;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, transform 0.13s;
      position: relative;
    }
    .cat-avatar-wrap.active .cat-avatar {
      border-color: transparent;
    }
    .cat-avatar-wrap.active {
      position: relative;
    }
    .cat-avatar-wrap.active::before {
      content: '';
      position: absolute;
      top: -5px; left: 50%;
      transform: translateX(-50%);
      width: calc(74px + 10px);
      height: calc(74px + 10px);
      border: 3px solid #6c3fc5;
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(108,63,197,0.5);
    }
    .cat-avatar:active { transform: scale(0.91); }
    .cat-avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .cat-avatar-ghost {
      opacity: 0.35;
      display: flex; align-items: center; justify-content: center;
    }
    .cat-avatar-label {
      font-size: 13px; font-weight: 700; color: #fff;
      max-width: 88px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      background: #111; border-radius: 6px;
      padding: 3px 8px; letter-spacing: 0.04em;
    }
    .cat-avatar-wrap.active .cat-avatar-label { background: #000; color: #fff; }

    /* ── PROGRESS BAR ── */
    .cat-progress-wrap {
      width: 74px; height: 5px; border-radius: 3px;
      background: #e8e8e8; overflow: hidden; margin-top: 2px;
    }
    .cat-progress-bar {
      height: 100%; border-radius: 3px;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    .dots { display: flex; gap: 5px; justify-content: center; padding: 10px 0 6px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #d8d8d8; transition: all 0.2s; }
    .dot.active { background: var(--text); width: 16px; border-radius: 3px; }

    /* ── CAROUSEL ── */
    .carousel-outer { flex: 1; min-height: 0; overflow: hidden; }
    .carousel-track {
      display: flex; height: 100%;
      transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
      will-change: transform;
    }
    .page {
      flex-shrink: 0; width: 100vw; height: 100%;
      overflow-y: auto; overflow-x: hidden;
      padding: 28px 20px 150px;
      display: block;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .page .task { margin-bottom: 10px; }
    .page::-webkit-scrollbar { display: none; }

    /* ── TASK ── */
    .task {
      border-radius: 14px;
      border: 1.5px solid var(--red-border);
      background: var(--red-soft);
      user-select: none; -webkit-user-select: none;
      transition: background 0.22s, border-color 0.22s;
      animation: slideIn 0.2s ease;
      overflow: hidden;
      position: relative;
    }
    .task.done { background: var(--green-soft); border-color: var(--green-border); }

    /* last action highlights */
    .task.last-done {
      border-color: #1a7a40;
      border-width: 2.5px;
      background: #e4f7ec;
    }
    .task.last-done .task-label { color: #1a7a40; opacity: 1; }
    .task.last-done .task-check { background: #1a7a40; border-color: #1a7a40; }

    .task.last-undone {
      border-color: #b81c1c;
      border-width: 2.5px;
      background: #ffffff;
    }
    .task.last-undone .task-label { color: #b81c1c; }
    .task.last-undone .task-check { border-color: #b81c1c; }

    /* ── TASK MAIN ROW ── */
    .task-main {
      display: flex; align-items: center;
      gap: 14px; padding: 15px 17px;
      /* This whole row is the "text area" click target */
      cursor: pointer;
    }
    .task-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--red); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.22s, border-color 0.22s;
      pointer-events: none; /* handled by parent */
    }
    .task.done .task-check { background: var(--green); border-color: var(--green); }
    .task-check svg { opacity: 0; transform: scale(0.5); transition: opacity 0.2s, transform 0.2s; }
    .task.done .task-check svg { opacity: 1; transform: scale(1); }
    .task-label {
      font-size: 15px; font-weight: 400; color: var(--red);
      transition: color 0.22s; flex: 1; line-height: 1.4;
      pointer-events: none; white-space: pre-wrap;
    }
    .heart-secret {
      display: block;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .task.done .heart-secret,
    .hearts-revealed .heart-secret {
      max-height: 500px;
      opacity: 1;
    }
    .task-link {
      color: #2563eb; text-decoration: underline;
      text-underline-offset: 2px; word-break: break-all;
      display: inline-block; max-width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      vertical-align: bottom; pointer-events: all;
    }
    .task.done .task-link { color: var(--green); }
    .task.done .task-label { color: var(--green); text-decoration: line-through; opacity: 0.7; }

    /* ── PHOTO ICON ZONE (always visible, right side) ── */
    .task-photo-zone {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 52px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    /* always add right padding so text never overlaps the icon */
    .task-main { padding-right: 56px; }

    /* ghost icon — no photo yet */
    .photo-icon-ghost {
      opacity: 0.13;
      transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .task-photo-zone:active .photo-icon-ghost { opacity: 0.28; }

    /* thumbnail — has photo */
    .task-thumb {
      width: 36px; height: 36px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 7px rgba(0,0,0,0.16);
      border: 1.5px solid rgba(255,255,255,0.7);
      transition: transform 0.13s;
    }
    .task-photo-zone:active .task-thumb { transform: scale(0.91); }
    .task-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* hold ring — anchored to the photo zone */
    .hold-ring {
      position: absolute; top: 50%; right: 26px;
      transform: translate(50%, -50%) scale(0);
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.18);
      pointer-events: none; opacity: 0;
    }
    .hold-ring.go { animation: holdExpand 0.55s ease forwards; }
    @keyframes holdExpand {
      0%   { transform: translate(50%,-50%) scale(0.3); opacity: 0.55; }
      100% { transform: translate(50%,-50%) scale(1.9); opacity: 0; }
    }
    #photo-viewer {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    #photo-viewer.show { opacity: 1; pointer-events: all; }
    #photo-viewer img {
      max-width: 94vw; max-height: 82vh;
      border-radius: 16px; object-fit: contain;
      transform: scale(0.88);
      transition: transform 0.26s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 28px 80px rgba(0,0,0,0.55);
      display: block;
    }
    #photo-viewer.show img { transform: scale(1); }
    #photo-viewer-close {
      position: absolute; top: 52px; right: 22px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: none;
      color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 5;
    }
    #photo-viewer-delete {
      position: absolute; top: 52px; right: 68px;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: none;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 5;
    }
    #photo-viewer-delete:active { background: rgba(232,64,64,0.55); }

    /* hold ring */
    .hold-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      width: 54px; height: 54px; border-radius: 50%;
      border: 2.5px solid rgba(0,0,0,0.12);
      pointer-events: none; opacity: 0;
    }
    .hold-ring.go { animation: holdExpand 0.55s ease forwards; }
    @keyframes holdExpand {
      0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0.5; }
      100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
    }

    .empty {
      text-align: center; padding: 50px 20px 0;
      color: var(--muted); font-size: 14px; font-weight: 300; line-height: 1.7;
    }
    .empty-icon { font-size: 28px; display: block; margin-bottom: 8px; }

    /* ── ADD BAR ── */
    #add-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 20px 32px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
      display: flex; gap: 10px; align-items: center; z-index: 20;
    }
    #new-task {
      flex: 1; background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 20px; padding: 13px 18px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text);
      outline: none; -webkit-appearance: none; transition: border-color 0.18s;
      resize: none; overflow-y: hidden; line-height: 1.4; min-height: 48px;
    }
    #add-bar { align-items: flex-end; }
    #new-task::placeholder { color: #c0c0c0; }
    #new-task:focus { border-color: #c0c0c0; }
    #add-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--text); border: none; color: #fff; font-size: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; transition: transform 0.12s;
    }
    #add-btn:active { transform: scale(0.9); }

    /* ── ADD TASK MODAL ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.22);
      z-index: 100; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 60px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    .modal-backdrop.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border-radius: 24px;
      padding: 28px 24px 32px; width: calc(100% - 32px); max-width: 480px;
      transform: translateY(-20px);
      transition: transform 0.26s cubic-bezier(0.4,0,0.2,1);
      max-height: 80vh; overflow-y: auto;
    }
    .modal-backdrop.show .modal { transform: translateY(0); }
    .modal h3 { font-family: 'DM Serif Display', serif; font-size: 22px; font-weight: 400; margin-bottom: 18px; }
    .modal-input {
      width: 100%; background: var(--bg); border: 1.5px solid #e8e8e8;
      border-radius: 12px; padding: 13px 16px;
      font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text);
      outline: none; -webkit-appearance: none; margin-bottom: 14px;
    }
    .modal-input:focus { border-color: #c0c0c0; }
    .section-label {
      font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .modal-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .modal-cat-chip {
      padding: 7px 14px; border-radius: 50px; font-size: 13px; font-weight: 500;
      border: 1.5px solid #e0e0e0; background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.15s;
    }
    .modal-cat-chip.selected { background: var(--text); border-color: var(--text); color: #fff; }
    .modal-cat-chip.new-chip { border-style: dashed; color: var(--text); border-color: #c0c0c0; }
    .new-cat-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .new-cat-input {
      flex: 1; background: var(--bg); border: 1.5px solid #e8e8e8; border-radius: 12px;
      padding: 11px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
      outline: none; -webkit-appearance: none;
    }
    .new-cat-input:focus { border-color: #b0b0b0; }
    .new-cat-ok {
      padding: 11px 18px; border-radius: 12px; background: var(--text);
      border: none; color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .modal-confirm {
      width: 100%; padding: 15px; border-radius: 50px; background: var(--text);
      border: none; color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: transform 0.12s;
    }
    .modal-confirm:active { transform: scale(0.97); }

    /* ── TIME PICKER ── */
    .time-toggle-btn {
      background: none; border: none; color: var(--muted);
      font-size: 13px; font-weight: 500; cursor: pointer;
      padding: 6px 2px; margin-bottom: 8px; text-align: left;
    }
    .time-toggle-btn:active { opacity: 0.6; }
    .time-picker-wrap {
      display: none; flex-direction: column; gap: 8px;
      margin-bottom: 14px; margin-top: 2px;
    }
    .time-picker-wrap.show { display: flex; }
    .time-picker-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .time-picker-label {
      font-size: 11px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.08em;
    }
    .time-picker {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg); border: 1.5px solid #e8e8e8;
      border-radius: 12px; padding: 6px 10px;
    }
    .time-scroll-col {
      flex: 1; height: 80px; overflow-y: scroll;
      scroll-snap-type: y mandatory; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .time-scroll-col::-webkit-scrollbar { display: none; }
    .time-scroll-item {
      height: 32px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; color: var(--muted);
      scroll-snap-align: center; cursor: pointer; transition: color 0.15s;
      padding: 0 4px;
    }
    .time-scroll-item.selected { color: var(--text); font-size: 20px; }
    .time-sep { font-size: 22px; font-weight: 700; color: var(--text); padding: 0 2px; }
    .time-clear-btn {
      background: none; border: none; color: var(--muted);
      font-size: 16px; cursor: pointer; padding: 4px; flex-shrink: 0;
    }
    .date-picker-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;
    }
    .emoji-quick-row {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .emoji-quick-btn {
      flex: 1; font-size: 20px; padding: 8px 0; border-radius: 12px;
      border: 1.5px solid #e8e8e8; background: var(--surface);
      cursor: pointer; transition: all 0.15s; line-height: 1;
    }
    .emoji-quick-btn:active { transform: scale(0.9); }
    .emoji-quick-btn.selected { background: var(--text); border-color: var(--text); }
    .emoji-quick-row.shake { animation: emoji-shake 0.42s ease; }
    @keyframes emoji-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }
    .date-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 50px; font-size: 13px; font-weight: 500;
      border: 1.5px solid #e0e0e0; background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif;
    }
    .date-chip.selected { background: var(--text); border-color: var(--text); color: #fff; }
    .date-chip-clear { border-color: #ffd6d6; color: var(--red); }
    .date-chip-clear.selected { background: var(--red); border-color: var(--red); color: #fff; }
    .date-preview {
      font-size: 13px; color: #555; margin-bottom: 14px;
      padding: 8px 14px; background: #f5f5f5; border-radius: 10px;
    }
    /* task com data urgente: borda esquerda + fundo vermelho */
    .task.urgent, .task.urgent-tomorrow, .task.urgent-future {
      border-left: 4px solid #e84040;
      background: #fff0f0;
      border-color: #ffa3a3;
    }
    /* task atrasada: fundo vermelho com listras diagonais amarelas */
    .task.overdue {
      border-left: 4px solid #e84040;
      border-color: #ffa3a3;
      background: repeating-linear-gradient(
        -45deg,
        #fff0f0,
        #fff0f0 8px,
        #fff8c0 8px,
        #fff8c0 16px
      );
    }
    .kanban-card.overdue {
      border-left: 4px solid #e84040;
      border-color: #ffa3a3;
      background: repeating-linear-gradient(
        -45deg,
        #fff0f0,
        #fff0f0 8px,
        #fff8c0 8px,
        #fff8c0 16px
      );
    }
    .task-date-badge {
      display: block; font-size: 13px; font-weight: 700;
      border-radius: 8px; padding: 4px 14px; margin-bottom: 5px;
      letter-spacing: 0.02em; text-align: center;
      min-width: 110px; width: fit-content;
    }
    .badge-today    { background: #e84040; color: #fff; }
    .badge-tomorrow { background: #e84040; color: #fff; }
    .badge-future   { background: #e84040; color: #fff; }
    .badge-overdue  { background: #ffd600; color: #7a5a00; }

    #photo-file-input { display: none; }

    /* ── GRADE (fat) MODE ── */
    .page.fat { gap: 12px; }

    /* task becomes taller — fixed height so the right-side photo can fill it */
    .page.fat .task { min-height: 90px; }

    /* text row: same as normal, photo zone stays absolutely on the right */
    /* (no change needed to task-main padding — right padding already set) */

    /* photo zone: same absolute positioning, but taller to fill the whole card */
    .page.fat .task-photo-zone {
      width: 90px;  /* wider in fat mode */
    }

    /* thumbnail grows to fill the whole zone height */
    .page.fat .task-thumb {
      width: 80px;
      height: 70px;
      border-radius: 10px;
    }

    /* text row right padding matches wider zone */
    .page.fat .task-main { padding-right: 100px; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }


    /* ── DONE DIVIDER ── */
    .done-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 10px 0 4px;
      color: var(--text); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .done-divider::before, .done-divider::after {
      content: ''; flex: 1; height: 2.5px; background: var(--text); border-radius: 2px;
    }
    /* ── TOAST ── */
    #done-toast {
      position: fixed;
      bottom: 110px; left: 20px; right: 20px;
      background: #1a7a40;
      color: #fff;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(26,122,64,0.35);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.22s, transform 0.22s;
    }
    #done-toast.show { opacity: 1; transform: translateY(0); pointer-events: all; }
    #done-toast .toast-icon {
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #done-toast .toast-text { font-size: 14px; font-weight: 600; line-height: 1.3; flex: 1; }
    #toast-undo-btn {
      flex-shrink: 0;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: #fff; border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 700;
      padding: 4px 10px; cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    #toast-undo-btn:active { background: rgba(255,255,255,0.38); }

    /* ── CAT CONTEXT MENU ── */
    #cat-menu-backdrop {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,0.18);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s;
    }
    #cat-menu-backdrop.show { opacity: 1; pointer-events: all; }
    #cat-menu {
      position: absolute;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      overflow: hidden;
      min-width: 180px;
      transform: scale(0.9);
      transform-origin: top center;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), opacity 0.15s;
      opacity: 0;
    }
    #cat-menu-backdrop.show #cat-menu { transform: scale(1); opacity: 1; }
    .cat-menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 15px 20px;
      font-size: 15px; font-weight: 500;
      cursor: pointer; color: var(--text);
      transition: background 0.12s;
      border: none; background: none; width: 100%; text-align: left;
      font-family: 'DM Sans', sans-serif;
    }
    .cat-menu-item:active { background: #f5f5f5; }
    .cat-menu-item.danger { color: #e84040; }
    .cat-menu-sep { height: 1px; background: #f0f0f0; margin: 0; }
    /* rename inline input on tab */
    .tab.renaming { padding: 0; }
    .tab-rename-input {
      background: transparent; border: none; outline: none;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      color: #fff; width: 80px; text-align: center;
    }

    /* ── KANBAN BUTTON ── */
    #vista-btn {
      background: var(--surface); border: 1.5px solid #e8e8e8;
      border-radius: 50px; padding: 7px 14px;
      font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); transition: transform 0.12s;
      color: #7c3aed;
    }
    #vista-btn:active { transform: scale(0.93); }
    #vista-btn.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    /* Oculto a pedido do usuário — mantém a função no código, só some da UI.
       Para reexibir, remova esta regra. */
    #vista-btn { display: none !important; }

    /* ── GRID OVERLAY ── */
    #vista-overlay {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 500; display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.34s cubic-bezier(0.4,0,0.2,1);
    }
    #vista-overlay.show { transform: translateY(0); }

    #vista-header {
      padding: 52px 16px 12px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #vista-title {
      font-family: 'DM Serif Display', serif;
      font-size: 24px; font-weight: 400; letter-spacing: -0.5px;
    }
    #vista-header-right { display: flex; align-items: center; gap: 8px; }
    #vista-close {
      width: 32px; height: 32px; border-radius: 50%;
      background: #f0eeeb; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; color: var(--muted);
      transition: transform 0.12s;
    }
    #vista-close:active { transform: scale(0.9); }
    #vista-total-badge {
      font-size: 10px; font-weight: 700; padding: 3px 10px;
      border-radius: 50px; background: #f0eeeb;
      color: var(--muted); letter-spacing: 0.04em;
    }

    /* ── GRID INLINE (home screen) ── */
    #grid-home {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #grid-home::-webkit-scrollbar { display: none; }
    /* inner wrapper for the two columns */
    #grid-home-inner {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: 2px 10px 180px;
      gap: 10px;
      min-height: 100%;
    }
    .grid-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      gap: 10px;
      position: relative;
    }
    /* Dead zone — fixed strip over the center gap, zero layout impact */
    .grid-dead-zone {
      position: fixed;
      top: 0; bottom: 0;
      width: 60px;
      z-index: 50;
      touch-action: pan-y;
    }

    /* ── CATEGORY CARD ── */
    .kanban-col {
      background: var(--surface);
      border: 1.5px solid #ebebeb;
      border-radius: 16px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color 0.22s, box-shadow 0.22s;
    }
    .kanban-col.unlocked-col {
      border: 2.5px solid #c8960a;
      box-shadow: 0 0 0 1px rgba(200,150,10,0.18);
    }
    /* Recolhida: só a barra preta com o nome fica visível */
    .kanban-col.collapsed .kanban-col-body,
    .kanban-col.collapsed .kanban-col-avatar-wrap,
    .kanban-col.collapsed .kanban-col-controls-row,
    .kanban-col.collapsed .kanban-head-prog-wrap {
      display: none !important;
    }
    .kanban-col.collapsed .kanban-col-head {
      padding: 16px 14px;
      border-bottom: none;
    }
    .kanban-col.collapsed .kanban-col-name-row {
      margin-bottom: 0;
    }

    /* Header — tappable, opens fullscreen */
    .kanban-col-head {
      padding: 40px 14px 12px;
      border-bottom: 1.5px solid #111;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      background: #111;
      transition: background 0.22s, border-color 0.22s, box-shadow 0.22s;
      position: relative;
    }
    .kanban-col-head:active { filter: brightness(0.85); }
    .kanban-col-head.unlocked-head {
      background: linear-gradient(135deg, #2a1f00 0%, #1a1200 60%, #3a2a00 100%);
      border-bottom: 3px solid #c8960a;
      box-shadow: inset 0 -3px 0 rgba(200,150,10,0.3);
    }
    .kanban-col-head.unlocked-head .kanban-col-arrow { color: #f5c842; }
    .kanban-col-name { color: #fff !important; }

    .kanban-col-name-row {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .kanban-col-name {
      font-size: 20px; font-weight: 700; letter-spacing: 0.03em;
      color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-align: center; max-width: 100%;
    }
    .kanban-col-arrow {
      position: absolute; top: 12px; right: 12px;
      font-size: 12px; color: rgba(255,255,255,0.7);
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    .kanban-col-controls-row {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-bottom: 10px;
    }
    .kanban-col-add-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.35);
      color: #fff; font-size: 20px; line-height: 1;

    .kanban-col-play-btn {

    .kanban-col-play-btn:active { background: rgba(255,255,255,0.35); transform: scale(0.88); }

    /* ── PLAY MODE: tarefa em tela cheia, uma por vez ── */
    #play-modal-backdrop {
      position: fixed; inset: 0; background: var(--text);
      z-index: 300; display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    #play-modal-backdrop.show { opacity: 1; pointer-events: all; }
    .play-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 52px 24px 12px; flex-shrink: 0;
    }
    .play-cat-name {
      font-family: 'DM Serif Display', serif; font-size: 20px;
      color: #fff; letter-spacing: -0.3px;
    }
    .play-close-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .play-close-btn:active { transform: scale(0.9); }
    .play-progress-wrap {
      padding: 0 24px 20px; flex-shrink: 0;
    }
    .play-progress-track {
      width: 100%; height: 6px; border-radius: 6px;
      background: rgba(255,255,255,0.14); overflow: hidden;
    }
    .play-progress-fill {
      height: 100%; border-radius: 6px; background: var(--green);
      transition: width 0.3s ease;
    }
    .play-progress-label {
      margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.5);
      letter-spacing: 0.06em; text-align: center;
    }
    .play-body {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }
    .play-tap-zone {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .play-tap-zone::after {
      content: ''; position: absolute; inset: 0;
      background: var(--green); opacity: 0; pointer-events: none;
    }
    .play-tap-zone.flash-green::after {
      animation: playFlashGreen 0.38s ease;
    }
    @keyframes playFlashGreen {
      0% { opacity: 0.85; }
      100% { opacity: 0; }
    }
    .play-task-card {
      width: 100%; max-width: 520px; text-align: center;
      pointer-events: none;
      display: flex; flex-direction: column; align-items: center; gap: 24px;
    }
    .play-task-photo {
      width: 120px; height: 120px; border-radius: 24px; overflow: hidden;
      flex-shrink: 0; box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    }
    .play-task-photo img, .play-task-photo video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .play-task-text {
      font-family: 'DM Sans', sans-serif; font-weight: 500;
      font-size: 30px; line-height: 1.35; color: #fff;
      word-break: break-word;
    }
    .play-task-date {
      font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
      padding: 6px 16px; border-radius: 50px;
      background: rgba(255,255,255,0.14); color: #fff;
    }
    .play-task-date.is-today { background: rgba(232,64,64,0.25); color: #ff9a9a; }
    .play-end-overlay {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); padding: 24px;
      animation: playEnter 0.28s ease;
    }
    .play-end-card {
      width: 100%; max-width: 360px; background: var(--surface);
      border-radius: 24px; padding: 28px 22px 22px; text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .play-end-title {
      font-family: 'DM Serif Display', serif; font-size: 30px;
      color: var(--text); margin-bottom: 6px;
    }
    .play-end-sub { font-size: 14px; color: #777; line-height: 1.5; margin-bottom: 20px; }
    .play-task-hint {
      font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em;
    }
    .play-task-card.completing { animation: playComplete 0.4s ease forwards; }
    @keyframes playComplete {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.85); }
    }
    .play-task-card.entering { animation: playEnter 0.32s ease; }
    @keyframes playEnter {
      0% { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .play-skip-bar {
      flex-shrink: 0; margin: 0 24px 32px; padding: 16px;
      border-radius: 16px; text-align: center;
      background: rgba(232,64,64,0.14); border: 1.5px solid rgba(232,64,64,0.4);
      color: #ff8080; font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 600; letter-spacing: 0.06em;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s, background 0.12s;
    }
    .play-skip-bar:active { transform: scale(0.97); background: rgba(232,64,64,0.24); }
    .play-empty {
      color: rgba(255,255,255,0.6); font-size: 16px; text-align: center;
      padding: 24px; line-height: 1.6;
    }
    .play-empty-emoji { font-size: 48px; display: block; margin-bottom: 16px; }

    /* Avatar da categoria — cantinho superior esquerdo do cabeçalho */
    .kanban-col-avatar-wrap {
      position: absolute; top: 10px; left: 12px;
    }
    .kanban-col-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.14);
      border: 1.5px solid rgba(255,255,255,0.3);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .kanban-col-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .kanban-col-avatar:active { transform: scale(0.91); }

    /* progress bar */
    .kanban-head-prog-wrap {
      height: 8px; border-radius: 4px; background: rgba(255,255,255,0.35); overflow: hidden; margin-bottom: 8px;
    }
    .kanban-head-prog-bar { height: 100%; border-radius: 2px; transition: width 0.4s; }

    .kanban-col-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .kanban-badge {
      font-size: 9px; font-weight: 700; padding: 2px 8px;
      border-radius: 50px; letter-spacing: 0.03em;
    }
    .kanban-badge.pending { background: #ffd6d6; color: var(--red); }
    .kanban-badge.done-b  { background: #c3f0d5; color: var(--green); }

    /* task list */

    /* ── MINI TASK CARD ── */
    .kanban-card {
      background: #fafafa; border: 1.5px solid #efefef;
      border-radius: 11px; padding: 10px 11px;
      display: flex; align-items: flex-start; gap: 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s;
      user-select: none; -webkit-user-select: none;
      height: auto; box-sizing: border-box;
    }
    .kanban-card:active { background: #efefef; }
    .kanban-col-body .kanban-card:first-child {
      border: 1.5px solid #aaa;
    }
    .kanban-col-body .kanban-card:first-child.is-done {
      border: 1.5px solid var(--green);
    }
    .kanban-card.is-done { background: var(--green-soft); border-color: var(--green-border); opacity: 0.65; }
    .kanban-card.urgent, .kanban-card.urgent-tomorrow, .kanban-card.urgent-future { background: #fff0f0; border-color: #ffa3a3; border-left: 4px solid var(--red); }
    .kanban-card.popping { animation: kPop 0.2s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes kPop { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
    @keyframes kFlash {
      0%   { background: #fafafa; }
      20%  { background: #c3f0d5; }
      40%  { background: #fafafa; }
      60%  { background: #c3f0d5; }
      80%  { background: #fafafa; }
      100% { background: #fafafa; }
    }
    .kanban-card.flashing { animation: kFlash 0.7s ease; }
    .kanban-card.completing {
      background: var(--green-soft) !important;
      border-color: var(--green-border) !important;
      opacity: 0.85;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .kanban-card.completing .kanban-check {
      background: var(--green) !important;
      border-color: var(--green) !important;
    }
    .kanban-card.completing .kanban-check svg { opacity: 1 !important; transform: scale(1) !important; }
    .kanban-card.completing .kanban-text { color: var(--green) !important; }

    .kanban-check {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      border: 1.8px solid var(--red);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, border-color 0.15s; margin-top: 1px;
    }
    .kanban-card.is-done .kanban-check { background: var(--green); border-color: var(--green); }
    .kanban-check svg { opacity: 0; transform: scale(0.3); transition: opacity 0.15s, transform 0.15s; }
    .kanban-card.is-done .kanban-check svg { opacity: 1; transform: scale(1); }

    .kanban-text {
      flex: 1; font-size: 12px; line-height: 1.4; color: var(--red);
      word-break: break-word; transition: color 0.15s; white-space: pre-wrap;
    }
    .kanban-card.is-done .kanban-text { color: var(--green); text-decoration: line-through; opacity: 0.75; }

    /* ── Miniatura de foto (só aparece se a tarefa já tiver foto) — abaixo do texto, maior ── */
    .kanban-card { flex-wrap: wrap; }
    .kanban-photo-zone {
      flex: 1 0 100%;
      width: 100%;
      margin-top: 8px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .kanban-photo-thumb {
      width: 100%; height: 150px; border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.14);
      border: 1.3px solid rgba(255,255,255,0.7);
      transition: transform 0.13s;
    }
    .kanban-photo-zone:active .kanban-photo-thumb { transform: scale(0.97); }
    .kanban-photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .kanban-date-badge {
      display: block; font-size: 8px; font-weight: 700;
      border-radius: 4px; padding: 1px 5px; margin-bottom: 3px; width: fit-content;
    }
    .kanban-col-body {
      padding: 9px 9px 4px;
      display: flex; flex-direction: column; gap: 7px;
      max-height: 280px;
      overflow-y: hidden;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .kanban-col-body::-webkit-scrollbar { display: none; }
    .kanban-col-body.unlocked { overflow-y: auto; }
    .kanban-col-body.expanded { max-height: 2000px; overflow-y: auto; }

    .kanban-collapse-btn {
      display: none;
      width: 100%;
      text-align: center;
      padding: 10px 0 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border-top: 1.5px solid #f0f0f0;
      margin-top: 4px;
      color: var(--muted);
      font-size: 18px;
      transition: opacity 0.15s;
    }
    .kanban-collapse-btn:active { opacity: 0.5; }
    .kanban-col-body.expanded .kanban-collapse-btn { display: block; }

    /* ── CATEGORY FULLSCREEN ── */
    #cat-fullscreen {
      position: fixed; inset: 0; background: var(--bg);
      z-index: 600; display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    #cat-fullscreen.show { transform: translateX(0); }

    #cat-fs-header {
      padding: 52px 18px 14px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0; border-bottom: 1.5px solid #eee;
    }
    #cat-fs-back {
      width: 34px; height: 34px; border-radius: 50%;
      background: #f0eeeb; border: none; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px; color: var(--muted);
      transition: transform 0.12s;
    }
    #cat-fs-back:active { transform: scale(0.9); }
    #cat-fs-title {
      font-family: 'DM Serif Display', serif;
      font-size: 22px; font-weight: 400; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #cat-fs-badge {
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.04em; flex-shrink: 0;
    }

    #cat-fs-list {
      flex: 1; overflow-y: auto; padding: 12px 14px 120px;
      scrollbar-width: none;
    }
    #cat-fs-list::-webkit-scrollbar { display: none; }

    /* fullscreen cards — reuse .kanban-card but bigger */
    #cat-fs-list .kanban-card { padding: 12px 14px; margin-bottom: 7px; border-radius: 12px; }
    #cat-fs-list .kanban-check { width: 20px; height: 20px; }
    #cat-fs-list .kanban-photo-thumb { height: 190px; }
    #cat-fs-list .kanban-text { font-size: 14px; line-height: 1.4; }

    .cat-fs-done-sep {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--green);
      padding: 10px 2px 6px; display: flex; align-items: center; gap: 6px;
    }
    .cat-fs-done-sep::after { content:''; flex:1; height:1px; background:#c3f0d5; border-radius:1px; }

    /* ── MENU OCULTO AO INICIAR (toque no fundo alterna) ── */
    body.menu-hidden .menu-extra { display: none !important; }
    /* ── NEGRITO GERAL EM TUDO ── */
    body, body * {
      font-weight: 700 !important;
    }
  </style>
</head>

<script>
// ── STATE ──
let data = {
  cats: ['TAREFAS'],
  tasks: [],
  catAvatars: {},
  collapsedCats: [],
  manualOrderCats: []
};

// ── IndexedDB: persiste todo o estado incluindo fotos grandes ──
const DB_NAME = 'tarefasApp';
const DB_STORE = 'state';
const DB_KEY = 'appState';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (db) return resolve(db);
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

let cur = 0;
let lastTouchedCat = null; // categoria da última tarefa concluída/tocada — usada pelos botões ⏪⏩
let gradeMode = false;
const TODAS = 'TODAS';

function uid() { return Math.random().toString(36).slice(2,10); }
function clearJustAdded() {
  let changed = false;
  data.tasks.forEach(t => { if (t.justAdded) { delete t.justAdded; changed = true; } });
  return changed;
}
function save() {
  openDB().then(db => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(data, DB_KEY);
  }).catch(() => {});
  if (typeof scheduleBackup === 'function') scheduleBackup();
}

// ── UNDO HISTORY ──
const UNDO_MAX = 10;
let undoStack = []; // each entry: { snapshot: deepCopy(data), label: string }

function pushUndo(label) {
  // Deep clone current data (excluding large photo blobs to avoid memory bloat)
  const snapshot = JSON.parse(JSON.stringify({
    cats: data.cats,
    tasks: data.tasks.map(t => ({ ...t, photo: t.photo ? '__photo__' : null, photoType: t.photoType })),
    catAvatars: Object.fromEntries(Object.entries(data.catAvatars).map(([k]) => [k, '__avatar__']))
  }));
  // Store actual photos by task id
  snapshot._photos    = Object.fromEntries(data.tasks.filter(t => t.photo).map(t => [t.id, t.photo]));
  snapshot._avatars   = { ...data.catAvatars };
  undoStack.push({ snapshot, label });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  updateUndoBtn();
}

function updateUndoBtn() {
  const btn = document.getElementById('undo-btn');
  if (!btn) return;
  if (undoStack.length > 0) {
    btn.disabled = false;
    const last = undoStack[undoStack.length - 1];
    btn.title = 'Desfazer: ' + last.label;
  } else {
    btn.disabled = true;
    btn.title = '';
  }
}

function applyUndo() {
  if (!undoStack.length) return;
  const { snapshot, label } = undoStack.pop();

  // Salva posição de scroll antes de re-renderizar
  const pageScrolls = {};
  document.querySelectorAll('.page').forEach((p, i) => { pageScrolls[i] = p.scrollTop; });
  const gh = document.getElementById('grid-home');
  const gridScroll = gh ? gh.scrollTop : 0;
  const kanbanScrolls = {};
  document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => { kanbanScrolls[b.dataset.cat] = b.scrollTop; });

  // Restore photos
  const photos  = snapshot._photos  || {};
  const avatars = snapshot._avatars || {};
  delete snapshot._photos;
  delete snapshot._avatars;
  data.cats       = snapshot.cats;
  data.catAvatars = avatars;
  data.tasks      = snapshot.tasks.map(t => ({
    ...t,
    photo:     t.photo === '__photo__' ? (photos[t.id] || null) : null,
    photoType: t.photoType || 'image'
  }));
  save();
  cur = Math.max(0, Math.min(cur, allCats().length - 1));
  render();
  if (gridMode) renderGrid();

  // Restaura posição de scroll após re-renderizar
  requestAnimationFrame(() => {
    document.querySelectorAll('.page').forEach((p, i) => { if (pageScrolls[i]) p.scrollTop = pageScrolls[i]; });
    const gh2 = document.getElementById('grid-home');
    if (gh2 && gridScroll) gh2.scrollTop = gridScroll;
    document.querySelectorAll('.kanban-col-body[data-cat]').forEach(b => {
      if (kanbanScrolls[b.dataset.cat]) b.scrollTop = kanbanScrolls[b.dataset.cat];
    });
  });

  updateUndoBtn();
  showDoneToast('Desfeito: ' + label);
}

document.addEventListener('DOMContentLoaded', () => {
  const undoBtn = document.getElementById('undo-btn');
  if (undoBtn) undoBtn.addEventListener('click', applyUndo);
});
// fallback: bind after script runs too
setTimeout(() => {
  const undoBtn = document.getElementById('undo-btn');
  if (undoBtn && !undoBtn._undoBound) {
    undoBtn._undoBound = true;
    undoBtn.addEventListener('click', applyUndo);
  }
}, 0);
function allCats() { return [...data.cats]; }

// ── DOM ──
const tabsEl       = document.getElementById('tabs-scroll');
const dotsEl       = document.getElementById('dots');
const trackEl      = document.getElementById('carousel-track');
const outerEl      = document.getElementById('carousel-outer');
const modalEl      = document.getElementById('modal');
const modalTitleEl = document.getElementById('modal-title');
const taskInEl     = document.getElementById('modal-task-in');
const catLabelEl   = document.getElementById('cat-label');
const modalCatsEl  = document.getElementById('modal-cats');
const newCatRow    = document.getElementById('new-cat-row');
const newCatIn     = document.getElementById('new-cat-in');
const newCatOk     = document.getElementById('new-cat-ok');
const modalBtn     = document.getElementById('modal-confirm');
const newTaskIn    = document.getElementById('new-task');
const addBtn       = document.getElementById('add-btn');
const clearBtn     = document.getElementById('clear-btn');
const gradeBtn     = document.getElementById('grade-btn');
const photoViewer  = document.getElementById('photo-viewer');
const photoViewImg = document.getElementById('photo-viewer-img');
const photoViewClose = document.getElementById('photo-viewer-close');
const photoViewDelete = document.getElementById('photo-viewer-delete');
const photoFileIn  = document.getElementById('photo-file-input');
const avatarFileIn = document.getElementById('avatar-file-input');
const avatarsEl    = document.getElementById('cat-avatars');
let pendingAvatarCat = null;

// Atualiza só as barrinhas de progresso, sem re-renderizar os avatares
function updateProgressBars() {
  document.querySelectorAll('.cat-avatar-wrap[data-cat]').forEach(wrap => {
    const cat = wrap.dataset.cat;
    const bar = wrap.querySelector('.cat-progress-bar');
    if (!bar) return;
    const catTasks = data.tasks.filter(t => t.cat === cat);
    const total = catTasks.length;
    const done  = catTasks.filter(t => t.done).length;
    const pct   = total > 0 ? done / total : 0;

    bar.style.width = pct <= 0 ? '6px' : (pct * 100).toFixed(1) + '%';

    let barColor;
    if (pct <= 0) barColor = '#e84040';
    else if (pct < 0.5) {
      const g = Math.round(64 + (255 - 64) * pct * 2);
      barColor = `rgb(232,${Math.min(g, 255)},64)`;
    } else if (pct < 1) {
      const r = Math.round(255 - (255 - 46) * (pct - 0.5) * 2);
      const g = Math.round(200 + (158 - 200) * (pct - 0.5) * 2);
      barColor = `rgb(${r},${Math.max(g, 158)},64)`;
    } else {
      barColor = '#2e9e5b';
    }
    bar.style.backgroundColor = barColor;
  });
}

function renderAvatars() {
  avatarsEl.innerHTML = '';
  allCats().forEach((cat, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'cat-avatar-wrap' + (i === cur ? ' active' : '');
    wrap.dataset.cat = cat;

    const circle = document.createElement('div');
    circle.className = 'cat-avatar';

    const photo = data.catAvatars[cat];
    if (photo) {
      const img = document.createElement('img');
      img.src = photo; img.alt = cat;
      circle.appendChild(img);
    } else {
      const ghost = document.createElement('div');
      ghost.className = 'cat-avatar-ghost';
      ghost.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
      circle.appendChild(ghost);
    }

    // Long press → menu de contexto (renomear/excluir)
    let lpTimer = null;
    let didLp = false;
    const startLp = () => { didLp = false; lpTimer = setTimeout(() => { didLp = true; openCatMenu(cat, wrap); }, 500); };
    const clearLp = () => clearTimeout(lpTimer);
    circle.addEventListener('touchstart', startLp, { passive: true });
    circle.addEventListener('touchend',   clearLp, { passive: true });
    circle.addEventListener('touchmove',  clearLp, { passive: true });
    circle.addEventListener('mousedown',  startLp);
    circle.addEventListener('mouseup',    clearLp);

    // Tap simples → navega; se já ativo, abre upload de foto
    circle.addEventListener('click', () => {
      if (didLp) return;
      if (i === cur) {
        // já está nessa aba → abre upload
        pendingAvatarCat = cat;
        avatarFileIn.value = '';
        avatarFileIn.click();
      } else {
        // navega para a aba
        goTo(i);
      }
    });

    const label = document.createElement('div');
    label.className = 'cat-avatar-label';
    label.textContent = cat;

    // Progress bar
    const catTasksAll = data.tasks.filter(t => t.cat === cat);
    const catTotal = catTasksAll.length;
    const catDone  = catTasksAll.filter(t => t.done).length;
    const pct = catTotal > 0 ? catDone / catTotal : 0;
    const progWrap = document.createElement('div');
    progWrap.className = 'cat-progress-wrap';
    const progBar = document.createElement('div');
    progBar.className = 'cat-progress-bar';
    progBar.style.width = (pct * 100).toFixed(1) + '%';
    // Color: red → yellow → green
    let barColor;
    if (pct <= 0) barColor = '#e84040';
    else if (pct < 0.5) {
      // red to yellow
      const r = 232, g = Math.round(64 + (255-64)*pct*2), b = 64;
      barColor = `rgb(${r},${Math.min(g,255)},${b})`;
    } else if (pct < 1) {
      // yellow to green
      const r = Math.round(255 - (255-46)*(pct-0.5)*2);
      const g = Math.round(200 + (158-200)*(pct-0.5)*2);
      barColor = `rgb(${r},${Math.max(g,158)},64)`;
    } else {
      barColor = '#2e9e5b';
    }

// Fila de conclusões recentes: permite desfazer várias tarefas concluídas
// em sequência, uma por clique, mesmo que tenham sido concluídas rapidinho.
let toastUndoQueue = [];

function showQueuedToast() {
  if (!toastUndoQueue.length) return;
  const top = toastUndoQueue[toastUndoQueue.length - 1];
  toastText.textContent = top.text;
  toastUndoBtn.style.display = '';
  toastEl.style.background = '';
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
    toastEl.style.background = '';
    toastUndoQueue = [];
  }, 4000);
}

function queueDoneToast(text, undoFn) {
  toastUndoQueue.push({ text, fn: undoFn });
  showQueuedToast();
}

toastUndoBtn.addEventListener('click', () => {
  if (toastUndoQueue.length) {
    const top = toastUndoQueue.pop();
    top.fn();
    if (toastUndoQueue.length) {
      // Ainda há conclusões recentes: mostra a próxima para continuar desfazendo
      showQueuedToast();
      return;
    }
  } else if (toastUndoCallback) {
    toastUndoCallback();
    toastUndoCallback = null;
  }
  clearTimeout(toastTimer);
  toastEl.classList.remove('show');
});

function showDoneToast(text, undoFn, color) {
  // Toast avulso (não é conclusão de tarefa): limpa a fila de conclusões
  toastUndoQueue = [];
  toastText.textContent = text;
  toastUndoCallback = undoFn || null;
  toastUndoBtn.style.display = undoFn ? '' : 'none';
  toastEl.style.background = color || '';
  toastEl.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.classList.remove('show'); toastEl.style.background = ''; }, 4000);
}
